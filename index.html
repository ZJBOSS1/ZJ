<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>ZJ WEBSITE — Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    /* Dark Theme */
    --cyan: #00eaff; --cyan-lite: #7af5ff; --cyan-deep: #0077cc;
    --cyan-glow: rgba(0,234,255,0.55);
    --gold: #ffd700; --gold-lite: #ffe680; --gold-deep: #8a6f00;
    --gold-glow: rgba(255,215,0,0.5);
    --silver: #e8eef2; --silver-mid: #b8c4cc; --silver-dark: #6a7a84;
    
    --sidebar-w: 240px;
    --bg-0: #000;
    --bg-1: #0a0e12;
    --bg-2: #04060a;
    --border: #1f262c;
    --text: #f0f6fa;
    --muted: #7a8a94;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Light Theme - Silver, Black, Cyan, Gold */
  body.light-theme {
    --bg-0: #F1F5F9; --bg-1: #FFFFFF; --bg-2: #F8FAFC;
    --border: #CBD5E1; --text: #0F172A; --muted: #64748B;
    --cyan: #0EA5E9; --cyan-glow: rgba(14, 165, 233, 0.2);
    --gold: #F59E0B; --gold-glow: rgba(245, 158, 11, 0.2);
    --silver: #475569;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-0); color: var(--text); min-height: 100vh; overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }
  button { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .orb, .slides, .status-dot { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }

  /* BACKGROUND */
  .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at top left, #06222a 0%, transparent 55%), radial-gradient(ellipse at bottom right, #1a1400 0%, transparent 55%), var(--bg-0); }
  body.light-theme .bg { background: radial-gradient(ellipse at top left, #E0F2FE 0%, transparent 55%), radial-gradient(ellipse at bottom right, #FEF3C7 0%, transparent 55%), var(--bg-0); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,234,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,234,255,0.025) 1px, transparent 1px); background-size: 46px 46px; }
  body.light-theme .grid { opacity: 0.4; }
  .orb { position: absolute; border-radius: 50%; filter: blur(110px); animation: float 15s infinite ease-in-out; }
  .orb1 { width: 480px; height: 480px; background: var(--cyan); top: -140px; left: -140px; opacity: 0.16; }
  .orb2 { width: 560px; height: 560px; background: var(--gold); bottom: -180px; right: -120px; animation-delay: -5s; opacity: 0.14; }
  .orb3 { width: 340px; height: 340px; background: var(--silver); top: 45%; left: 48%; opacity: 0.07; animation-delay: -9s; }
  body.light-theme .orb { opacity: 0.1; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-50px) scale(1.1); } }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 50; padding: 22px 16px; display: flex; flex-direction: column; background: linear-gradient(180deg, #0d1014 0%, #040608 55%, #000 100%); border-right: 1px solid var(--border); box-shadow: 8px 0 40px rgba(0,0,0,0.85); transition: transform 0.35s ease; }
  body.light-theme .sidebar { background: #FFFFFF; box-shadow: 4px 0 24px rgba(15,23,42,0.04); border-right-color: #CBD5E1; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand-logo { width: 42px; height: 42px; border-radius: 12px; background: radial-gradient(circle at 30% 25%, #fff7c2, var(--gold) 45%, var(--gold-deep) 100%); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #2a1e00; font-family: Georgia, serif; box-shadow: 0 4px 20px var(--gold-glow); }
  body.light-theme .brand-logo { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: #fff; box-shadow: 0 4px 14px var(--cyan-glow); }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 45%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  body.light-theme .brand-name { background: linear-gradient(180deg, #0F172A 0%, #475569 45%, #F59E0B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .nav-label { font-size: 10px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin: 14px 8px 10px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; margin-bottom: 4px; border-radius: 10px; color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; transition: all 0.2s ease; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
  body.light-theme .nav-item:hover { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; }
  .nav-item.active { color: var(--text); background: linear-gradient(180deg, rgba(255,215,0,0.16), rgba(255,215,0,0.03)); border: 1px solid rgba(255,215,0,0.45); }
  body.light-theme .nav-item.active { background: #F1F5F9; border-color: #0EA5E9; color: #0F172A; font-weight: 600; }
  .sidebar-footer { margin-top: auto; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 11px; color: #5a6a74; text-align: center; line-height: 1.6; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); margin-right: 5px; vertical-align: middle; }

  /* TOP BAR */
  .topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: 62px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; background: rgba(10,14,18,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); transition: left 0.35s ease; }
  body.light-theme .topbar { background: rgba(255,255,255,0.95); border-bottom: 1px solid var(--border); }
  .menu-toggle { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .clock { font-family: 'Courier New', monospace; font-size: 13px; color: var(--cyan); padding: 6px 14px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); letter-spacing: 1px; }
  body.light-theme .clock { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; font-weight: 600; }
  .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s ease; }
  .theme-toggle:hover { border-color: var(--cyan); color: var(--cyan); }

  /* MAIN */
  .main { position: relative; z-index: 2; margin-left: var(--sidebar-w); padding: 90px 26px 100px; transition: margin-left 0.35s ease; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 900; text-align: center; background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 40%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  body.light-theme .hero h1 { background: linear-gradient(180deg, #0F172A 0%, #475569 40%, #D97706 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero h2 { margin: 0; font-size: 13px; letter-spacing: 4px; color: var(--cyan); text-align: center; text-transform: uppercase; margin-bottom: 30px; }

  .panel { max-width: 1220px; margin: 0 auto; padding: 26px; border-radius: 22px; background: var(--bg-1); border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  body.light-theme .panel { box-shadow: 0 4px 24px rgba(15,23,42,0.06); }
  .main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 25px; flex-wrap: wrap; }

  /* FRAME / CARDS */
  .frame { width: 320px; height: 550px; border-radius: 16px; border: 2px solid #c0c0c0; overflow: hidden; background: var(--bg-2); display: flex; flex-direction: column; position: relative; }
  body.light-theme .frame { background: var(--bg-1); border-color: #CBD5E1; }
  .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  body.light-theme .card-head { border-bottom-color: #E2E8F0; }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.silver { background: var(--silver); box-shadow: 0 0 8px var(--silver); }
  .dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dot.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  /* TOAST NOTIFICATIONS */
  .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--bg-1); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.3s ease 2.7s forwards; display: flex; align-items: center; gap: 8px; }
  body.light-theme .toast { box-shadow: 0 8px 24px rgba(15,23,42,0.1); }
  .toast.success { border-color: #10B981; color: #10B981; }
  body.light-theme .toast.success { background: #ECFDF5; }
  .toast.error { border-color: #EF4444; color: #EF4444; }
  body.light-theme .toast.error { background: #FEF2F2; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(20px) scale(0.9); } }

  /* CALCULATOR */
  .icon-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--silver-mid); color: var(--silver); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.18s ease; padding: 0; }
  body.light-theme .icon-btn { background: #F8FAFC; color: #475569; border-color: #CBD5E1; }
  .icon-btn:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); transform: scale(1.08); }
  body.light-theme .icon-btn:hover { color: #0EA5E9; border-color: #0EA5E9; background: #F0F9FF; }
  .calc-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
  .calc-display { width: 100%; height: 65px; background: #000; color: #fff; border: 1px solid var(--cyan); border-radius: 10px; font-size: 26px; text-align: right; padding: 10px; margin-bottom: 10px; font-family: 'Courier New', monospace; font-weight: 600; letter-spacing: 1px; box-shadow: inset 0 3px 12px rgba(0,0,0,0.9), 0 0 20px rgba(0,234,255,0.1); outline: none; }
  body.light-theme .calc-display { background: #0F172A; color: #0EA5E9; border-color: #0EA5E9; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
  .calc button { border-radius: 10px; border: 1px solid transparent; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.08s ease; display: flex; align-items: center; justify-content: center; }
  .calc button:active { transform: translateY(1px) scale(0.98); }
  .btn-num { background: linear-gradient(180deg, #2a3238 0%, #141a1f 100%); color: #fff; border-color: #2e3840; }
  .btn-num:hover { background: linear-gradient(180deg, #3a444c 0%, #20282f 100%); }
  body.light-theme .btn-num { background: #FFFFFF; color: #0F172A; border-color: #CBD5E1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  body.light-theme .btn-num:hover { background: #F1F5F9; }
  .btn-op { background: linear-gradient(180deg, #00aaff, var(--cyan-deep)); color: #fff; border-color: var(--cyan); }
  body.light-theme .btn-op { background: #0EA5E9; color: #fff; border-color: #0284C7; }
  .btn-silver { background: linear-gradient(180deg, #d9d9d9 0%, #a8a8a8 100%); color: #000; border-color: #c0c0c0; }
  body.light-theme .btn-silver { background: #F1F5F9; color: #0F172A; border-color: #CBD5E1; }
  .btn-equal { background: linear-gradient(180deg, #fff0a0 0%, var(--gold) 55%, var(--gold-deep) 100%); color: #2a1e00; grid-column: span 2; font-size: 20px; border-color: var(--gold); }
  body.light-theme .btn-equal { background: #F59E0B; color: #fff; border-color: #D97706; }

  /* SLIDER & LIGHTBOX */
  .slider-wrap { flex: 1; overflow: hidden; position: relative; background: #000; }
  .slides { display: flex; width: max-content; height: 100%; animation: slideRight 10s linear infinite; }
  .slides:hover { animation-play-state: paused; }
  .slides img { width: 320px; height: 100%; object-fit: cover; flex-shrink: 0; display: block; cursor: pointer; transition: transform 0.3s; }
  .slides img.error { opacity: 0.35; cursor: default; }
  @keyframes slideRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }
  
  .lightbox { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
  .lightbox.open { display: flex; opacity: 1; }
  .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; background: none; border: none; }

  /* WEATHER */
  .weather-inner { padding: 18px; display: flex; flex-direction: column; flex: 1; }
  .weather-search { display: flex; gap: 8px; margin-bottom: 15px; }
  .weather-search input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); outline: none; font-family: inherit; min-width: 0; }
  body.light-theme .weather-search input { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; }
  .weather-search input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,234,255,0.3); }
  .weather-search button { padding: 0 14px; border-radius: 10px; background: var(--cyan); color: #001418; font-weight: 800; cursor: pointer; border: none; }
  body.light-theme .weather-search button { background: #0EA5E9; color: #fff; }
  
  .weather-main { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
  .weather-icon { width: 64px; height: 64px; margin-bottom: 10px; }
  .temp { font-size: 48px; font-weight: 800; line-height: 1; text-shadow: 0 0 15px var(--cyan-glow); }
  body.light-theme .temp { color: #0F172A; text-shadow: none; }
  .w-details { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 8px; }
  .w-details strong { color: var(--cyan); }
  body.light-theme .w-details strong { color: #0EA5E9; }
  
  .weather-forecast { display: flex; justify-content: space-between; gap: 8px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
  body.light-theme .weather-forecast { border-top-color: #E2E8F0; }
  .forecast-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .forecast-day .f-icon { width: 24px; height: 24px; }
  .forecast-day .f-temp { color: var(--text); font-weight: 700; font-size: 13px; }

  /* CHAT FAB */
  .chat-fab { position: fixed; bottom: 30px; right: 26px; width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer; z-index: 40; background: radial-gradient(circle at 30% 25%, #7af5ff, var(--cyan) 45%, var(--cyan-deep) 100%); display: flex; align-items: center; justify-content: center; color: #001418; box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -3px 8px rgba(0,0,0,0.4), 0 8px 30px var(--cyan-glow); transition: transform 0.2s ease; }
  body.light-theme .chat-fab { background: #0EA5E9; color: #fff; box-shadow: 0 4px 14px var(--cyan-glow); }
  .chat-fab:hover { transform: scale(1.08); }

  /* CHAT PANEL */
  .chat-panel { position: fixed; inset: 0; height: 100dvh; z-index: 100; display: flex; flex-direction: column; background: radial-gradient(ellipse at top, rgba(8,16,24,0.98) 0%, rgba(0,0,0,0.99) 60%), var(--bg-0); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  body.light-theme .chat-panel { background: #F1F5F9; }
  .chat-panel.open { opacity: 1; pointer-events: auto; }
  .chat-head { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); background: var(--bg-1); flex-shrink: 0; flex-wrap: wrap; }
  body.light-theme .chat-head { background: #FFFFFF; border-bottom-color: #CBD5E1; }
  .chat-head-info { display: flex; align-items: center; gap: 10px; }
  .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #7af5ff, var(--cyan) 50%, var(--cyan-deep)); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #001418; box-shadow: 0 0 18px var(--cyan-glow); }
  body.light-theme .chat-avatar { background: #0EA5E9; color: #fff; box-shadow: none; }
  .chat-name { font-weight: 800; font-size: 16px; }
  .chat-sub { color: var(--cyan); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  body.light-theme .chat-sub { color: #0EA5E9; }

  .chat-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-action-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.18s ease; border: 1px solid; background: transparent; }
  .chat-action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .chat-action-btn.gold { border-color: rgba(255,215,0,0.5); color: var(--gold-lite); background: rgba(255,215,0,0.06); }
  .chat-action-btn.gold:hover { color: #fff; border-color: var(--gold); background: rgba(255,215,0,0.16); box-shadow: 0 0 18px var(--gold-glow); }
  body.light-theme .chat-action-btn.gold { color: #B45309; border-color: #FCD34D; background: #FEF3C7; }
  .chat-action-btn.cyan { border-color: rgba(0,234,255,0.4); color: var(--cyan-lite); background: rgba(0,234,255,0.06); }
  .chat-action-btn.cyan:hover { color: #fff; border-color: var(--cyan); background: rgba(0,234,255,0.16); box-shadow: 0 0 18px var(--cyan-glow); }
  body.light-theme .chat-action-btn.cyan { color: #0369A1; border-color: #7DD3FC; background: #E0F2FE; }
  .chat-action-btn.danger { border-color: rgba(255,92,92,0.4); color: #ff9a9a; background: rgba(255,92,92,0.06); padding: 8px 10px; }
  .chat-action-btn.danger:hover { color: #fff; border-color: #ff5c5c; background: rgba(255,92,92,0.16); box-shadow: 0 0 18px rgba(255,92,92,0.5); }
  body.light-theme .chat-action-btn.danger { color: #B91C1C; border-color: #FCA5A5; background: #FEE2E2; }
  .chat-close { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.15s ease; background: transparent; border: 1px solid var(--border); color: var(--text); }
  .chat-close:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
  body.light-theme .chat-close { border-color: #CBD5E1; color: #64748B; }

  /* CHAT WINDOW & MARKDOWN */
  .chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.bot { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.45; position: relative; word-wrap: break-word; }
  .msg.bot { background: var(--bg-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  body.light-theme .msg.bot { background: #fff; border-color: #CBD5E1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .msg.user { background: var(--cyan-lite); color: #001418; font-weight: 600; border-bottom-right-radius: 4px; }
  body.light-theme .msg.user { background: #0EA5E9; color: #fff; }
  .msg code { background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  body.light-theme .msg code { background: rgba(0,0,0,0.05); }
  
  .chat-suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }

<script>
/* ============ TOAST NOTIFICATIONS ============ */
function showToast(message, type = 'info') {

/* ============ SIDEBAR / THEME / CLOCK ============ */
function scrollToSection(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
function focusCalc(){ document.getElementById('calcCard').scrollIntoView({behavior:'smooth', block:'center'}); }
function focusWeather(){ document.getElementById('weatherCard').scrollIntoView({behavior:'smooth', block:'center'}); }

function toggleTheme(){
  const isLight = document.body.classList.toggle('light-theme');
  localStorage.setItem('zj_theme', isLight ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
}
if (localStorage.getItem('zj_theme') === 'light') {
  document.body.classList.add('light-theme'); document.getElementById('themeToggle').textContent = '☀️';
}
setInterval(() => {
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}, 1000);

/* ============ GALLERY LIGHTBOX ============ */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e) {
  if (e.target.id !== 'lightboxImg') {
    document.getElementById('lightbox').classList.remove('open');
  }
}

/* ============ CALCULATOR ============ */
const display = document.getElementById('calcDisplay');
let calcHistory = JSON.parse(localStorage.getItem('zj_calc_history') || '[]');
function saveCalcHistory(){ localStorage.setItem('zj_calc_history', JSON.stringify(calcHistory.slice(-50))); }
function appendChar(c){
  const v = display.value;
  if (v === '0' && c !== '.') display.value = c;
  else if (c === '.' && /\.\d*$/.test(v)) return;
  else display.value = v + c;
}
function clearCalc(){ display.value = '0'; }
function delChar(){ display.value = display.value.slice(0,-1) || '0'; }
function safeEval(input){
  if (!/^[\d+\-*/().%×÷\s]+$/.test(input)) throw new Error('Invalid');
  const expr = input.replace(/%/g, '/100').replace(/×/g, '*').replace(/÷/g, '/');
  const tokens = expr.match(/\d+\.?\d*|[+\-*/()]/g);
  if (!tokens) throw new Error('Empty');
  const prec = { '+':1, '-':1, '*':2, '/':2 };
  const out = [], ops = []; let prev = null;
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));
    else if (t === '(') ops.push(t);
    else if (t === ')') {
      while (ops.length && ops[ops.length-1] !== '(') out.push(ops.pop());
      if (!ops.length) throw new Error('Bad'); ops.pop();
    } else {
      if (t === '-' && (prev === null || prev === '(' || prec[prev])) out.push(0);
      while (ops.length && prec[ops[ops.length-1]] >= prec[t]) out.push(ops.pop());
      ops.push(t);
    }
    prev = t;
  }
  while (ops.length) { const op = ops.pop(); if (op === '(') throw new Error('Bad'); out.push(op); }
  const stack = [];
  for (const t of out) {
    if (typeof t === 'number') { stack.push(t); continue; }
    const b = stack.pop(), a = stack.pop();
    let r; switch (t) {
      case '+': r = a + b; break; case '-': r = a - b; break;
      case '*': r = a * b; break; case '/': if (b === 0) throw new Error('Err'); r = a / b; break;
    }
    stack.push(r);
  }
  if (stack.length !== 1) throw new Error('Bad');
  return Math.round(stack[0] * 1e12) / 1e12;
}
function calculate(){
  try {
    const original = display.value;
    if (!original || original === '0') return;
    const result = safeEval(original);
    display.value = result;
    calcHistory.push({ expr: original, result, ts: Date.now() });
    if (calcHistory.length > 50) calcHistory.shift();
    saveCalcHistory();
  } catch { display.value = 'Error'; setTimeout(() => { if (display.value === 'Error') display.value = '0'; }, 1200); }
}
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (document.getElementById('chatPanel').classList.contains('open')) return;
  if (document.querySelector('.modal-overlay')) return;
  const key = e.key;
  if (/^[0-9.]$/.test(key)) { appendChar(key); e.preventDefault(); }
  else if (key === '+') { appendChar('+'); e.preventDefault(); }
  else if (key === '-') { appendChar('-'); e.preventDefault(); }
  else if (key === '*') { appendChar('×'); e.preventDefault(); }
  else if (key === '/') { appendChar('÷'); e.preventDefault(); }
  else if (key === '%') { appendChar('%'); e.preventDefault(); }
  else if (key === 'Enter' || key === '=') { calculate(); e.preventDefault(); }
  else if (key === 'Backspace') { delChar(); e.preventDefault(); }
  else if (key === 'Escape') { clearCalc(); e.preventDefault(); }
});
function openCalcHistory(){
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const box = document.createElement('div'); box.className = 'modal-box';
  box.innerHTML = `<div class="modal-head"><div class="modal-title">CALCULATOR HISTORY</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div class="modal-list" id="calcHistoryList"></div>`;
  const list = box.querySelector('#calcHistoryList');
  if (calcHistory.length === 0) list.innerHTML = '<div class="modal-empty">No calculations yet.</div>';
  else calcHistory.slice().reverse().forEach(h => {
    const item = document.createElement('div'); item.className = 'modal-item';
    item.innerHTML = `<div class="modal-item-title">${h.expr} = <span style="color:var(--gold);">${h.result}</span></div><div class="modal-item-meta">${new Date(h.ts).toLocaleString()}</div>`;
    item.onclick = () => { display.value = String(h.result); overlay.remove(); };
    list.appendChild(item);
  });
  if (calcHistory.length > 0) {
    const footer = document.createElement('div'); footer.className = 'modal-footer';
    const clearBtn = document.createElement('button'); clearBtn.className = 'modal-new-btn danger'; clearBtn.textContent = 'Clear All History';
    clearBtn.onclick = () => { if(confirm('Clear all history?')){ calcHistory=[]; saveCalcHistory(); overlay.remove(); } };
    footer.appendChild(clearBtn); box.appendChild(footer);
  }
  overlay.appendChild(box); document.body.appendChild(overlay);
}

/* ============ WEATHER (Open-Meteo with Auto-Location & Icons) ============ */
const WEATHER_TTL = 10 * 60 * 1000;
const weatherCache = {};
let weatherAbort = null;

const WMO_CODES = {
  0: { desc: "Clear sky", icon: "☀️" }, 1: { desc: "Mainly clear", icon: "🌤️" }, 2: { desc: "Partly cloudy", icon: "⛅" }, 3: { desc: "Overcast", icon: "☁️" },
  45: { desc: "Fog", icon: "🌫️" }, 48: { desc: "Rime fog", icon: "🌫️" }, 51: { desc: "Light drizzle", icon: "🌧️" },
  61: { desc: "Slight rain", icon: "🌧️" }, 63: { desc: "Moderate rain", icon: "🌧️" }, 65: { desc: "Heavy rain", icon: "🌧️" },
  71: { desc: "Slight snow", icon: "🌨️" }, 73: { desc: "Moderate snow", icon: "🌨️" }, 75: { desc: "Heavy snow", icon: "🌨️" },
  95: { desc: "Thunderstorm", icon: "⛈️" }, 96: { desc: "Thunderstorm", icon: "⛈️" }, 99: { desc: "Thunderstorm", icon: "⛈️" }
};

async function getWeather(lat, lon, locationName) {
  const input = document.getElementById('cityInput');
  const tempEl = document.getElementById('temp');
  const detEl = document.getElementById('wDetails');
  const btn = document.getElementById('weatherBtn');
  const forecastEl = document.getElementById('weatherForecast');
  
  let city = locationName || input.value.trim() || 'Hyderabad';
  let latParam = lat, lonParam = lon;

  const cacheKey = lat ? `loc_${lat}_${lon}` : city.toLowerCase();
  const cached = weatherCache[cacheKey];
  if (cached && Date.now() - cached.ts < WEATHER_TTL) {
    renderWeather(cached.data, city); return;
  }

  btn.disabled = true; tempEl.textContent = '...'; detEl.textContent = 'Loading...';
  if (weatherAbort) weatherAbort.abort(); weatherAbort = new AbortController();

  try {
    if (!lat || !lon) {
      const countryCode = (city.toLowerCase() === 'hyderabad') ? '&countryCode=PK' : '';
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json${countryCode}`, { signal: weatherAbort.signal });
      const geoData = await geoRes.json();
      if (!geoData.results || geoData.results.length === 0) throw new Error('City not found');
      const loc = geoData.results[0];
      latParam = loc.latitude; lonParam = loc.longitude; city = loc.name + ', ' + loc.country_code;
    }

    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latParam}&longitude=${lonParam}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&hourly=relative_humidity_2m,apparent_temperature&timezone=auto`, { signal: weatherAbort.signal });
    const weatherData = await weatherRes.json();
    
    weatherCache[cacheKey] = { data: weatherData, ts: Date.now() };
    renderWeather(weatherData, city);

  } catch (e) {
    if (e.name === 'AbortError') return;
    tempEl.textContent = '--°'; detEl.textContent = e.message === 'City not found' ? 'City not found.' : 'Fetch failed.';
  } finally { btn.disabled = false; }
}

function renderWeather(weather, cityName) {
  const current = weather.current_weather;
  const daily = weather.daily;
  const hourly = weather.hourly;
  
  const currentHour = current.time;
  const hourIndex = hourly.time.indexOf(currentHour);
  const humidity = hourIndex !== -1 ? hourly.relative_humidity_2m[hourIndex] : '--';
  const feelsLike = hourIndex !== -1 ? hourly.apparent_temperature[hourIndex] : current.temperature;
  const codeInfo = WMO_CODES[current.weathercode] || { desc: 'Unknown', icon: '❓' };

  document.getElementById('cityInput').value = cityName.split(',')[0];
  document.getElementById('temp').innerHTML = `${codeInfo.icon} ${Math.round(current.temperature)}°C`;
  document.getElementById('wDetails').innerHTML = `<strong>${cityName.toUpperCase()}</strong><br>${codeInfo.desc}<br>Feels: ${Math.round(feelsLike)}°C · Hum: ${humidity}%`;
  
  const forecastEl = document.getElementById('weatherForecast');
  forecastEl.style.display = 'flex';
  forecastEl.innerHTML = '';
  
  for (let i = 1; i <= 3; i++) {
    const dayCode = WMO_CODES[daily.weathercode[i]] || { icon: '❓' };
    const date = new Date(daily.time[i]);
    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
    const maxT = Math.round(daily.temperature_2m_max[i]);
    const minT = Math.round(daily.temperature_2m_min[i]);
    
    forecastEl.innerHTML += `
      <div class="forecast-day">
        <div>${dayName}</div>
        <div class="f-icon" style="font-size:18px">${dayCode.icon}</div>
        <div class="f-temp">${maxT}° / ${minT}°</div>
      </div>
    `;
  }
}

// Try auto-location on load
if ("geolocation" in navigator) {
  navigator.geolocation.getCurrentPosition(
    (pos) => getWeather(pos.coords.latitude, pos.coords.longitude, "My Location"),
    () => getWeather(),
    { timeout: 5000 }
  );
} else {
  getWeather();
}

/* ============ CHATBOT ============ */
const chatWindow = document.getElementById('chatWindow');
const chatInput  = document.getElementById('chatInput');
const chatPanel  = document.getElementById('chatPanel');
const chatFab    = document.getElementById('chatFab');
const BOT_API    = '/chat';
const WELCOME_MSG = "Hi! I'm ZJ Bot 👋 How can I help you today?";

let chatSessions  = JSON.parse(localStorage.getItem('zj_chat_sessions') || '[]');
let currentChatId = localStorage.getItem('zj_current_chat') || null;

if (chatSessions.length > 0 && !chatSessions.find(s => s.id === currentChatId)) currentChatId = chatSessions[0].id;
else if (chatSessions.length === 0) currentChatId = null;

function persistChats(){ localStorage.setItem('zj_chat_sessions', JSON.stringify(chatSessions)); localStorage.setItem('zj_current_chat', currentChatId || ''); }
function getCurrentSession(){ return chatSessions.find(s => s.id === currentChatId) || null; }
function createNewSession(){
  const id = 'chat_' + Date.now();
  const session = { id, title: 'New Chat', messages: [{ sender: 'bot', text: WELCOME_MSG }] };
  chatSessions.unshift(session); currentChatId = id; persistChats(); return session;
}

// Simple Markdown formatter for chat
function formatMarkdown(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function renderChat(){
  chatWindow.innerHTML = '';
  const session = getCurrentSession(); if (!session) return;
  session.messages.forEach(m => {
    const wrapper = document.createElement('div'); wrapper.className = 'msg-wrapper ' + m.sender;
    const msgDiv = document.createElement('div'); msgDiv.className = 'msg ' + m.sender;
    
    if (m.sender === 'bot') msgDiv.innerHTML = formatMarkdown(m.text);
    else msgDiv.textContent = m.text;
    
    wrapper.appendChild(msgDiv);

    if (m.sender === 'bot') {
      const actions = document.createElement('div'); actions.className = 'msg-actions';
      const copyBtn = document.createElement('button'); copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(m.text);
        copyBtn.innerHTML = 'Copied!';
        showToast('Copied to clipboard', 'success');
        setTimeout(() => copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`, 1800);
      };
      actions.appendChild(copyBtn); wrapper.appendChild(actions);
    }
    chatWindow.appendChild(wrapper);
  });
  
  // Add Suggestion Chips if only welcome message exists
  const sessionMsgs = session.messages;
  if (sessionMsgs.length === 1 && sessionMsgs[0].text === WELCOME_MSG) {
    const suggWrap = document.createElement('div'); suggWrap.className = 'chat-suggestions';
    const suggestions = ["Who are you?", "Tell me a joke", "What can you do?"];
    suggestions.forEach(text => {
      const chip = document.createElement('button'); chip.className = 'suggestion-chip'; chip.textContent = text;
      chip.onclick = () => { chatInput.value = text; sendMessage(); };
      suggWrap.appendChild(chip);
    });
    chatWindow.appendChild(suggWrap);
  }
  scrollToBottom();
}

function pushMessage(sender, text){
  let session = getCurrentSession(); if (!session) session = createNewSession();
  session.messages.push({ sender, text }); persistChats(); renderChat();
}
function openChat(){
  chatPanel.classList.add('open'); chatFab.style.display = 'none'; document.body.style.overflow = 'hidden';
  if (!currentChatId) createNewSession();
  renderChat(); setTimeout(() => chatInput.focus(), 300);
}
function closeChat(){
  chatPanel.classList.remove('open'); chatFab.style.display = 'flex'; document.body.style.overflow = '';
}
async function sendMessage(){
  const text = chatInput.value.trim(); if (!text) return;
  if (!currentChatId) createNewSession();
  pushMessage('user', text); chatInput.value = '';
  const session = getCurrentSession();
  if (session && session.title === 'New Chat') { session.title = text.slice(0, 30); persistChats(); }
  
  const wrapper = document.createElement('div'); wrapper.className = 'msg-wrapper bot';
  const typingEl = document.createElement('div'); typingEl.className = 'msg bot typing'; typingEl.textContent = 'ZJ is typing...';
  wrapper.appendChild(typingEl); chatWindow.appendChild(wrapper); scrollToBottom();

  try {
    const res = await fetch(BOT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
    const data = await res.json(); wrapper.remove();
    pushMessage('bot', data.reply || 'No response');
  } catch {
    wrapper.remove(); pushMessage('bot', '⚠️ Cannot reach server. Check connection.');
  }
}

function newChat(){ createNewSession(); renderChat(); }
function clearChat(){
  const session = getCurrentSession(); if (!session) return;
  if (!confirm('Clear this chat?')) return;
  session.messages = [{ sender: 'bot', text: WELCOME_MSG }]; session.title = 'New Chat'; persistChats(); renderChat();
}
function showChatHistory(){
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const box = document.createElement('div'); box.className = 'modal-box';
  box.innerHTML = `<div class="modal-head"><div class="modal-title">CHAT HISTORY</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div class="modal-list" id="chatHistoryList"></div>`;
  const list = box.querySelector('#chatHistoryList');
  if (chatSessions.length === 0) list.innerHTML = '<div class="modal-empty">No chat history yet.</div>';
  else chatSessions.forEach(s => {
    const item = document.createElement('div'); item.className = 'modal-item' + (s.id === currentChatId ? ' active' : '');
    const userMsgs = s.messages.filter(m => m.sender === 'user').length;
    item.innerHTML = `<div class="modal-item-title">${s.title}</div><div class="modal-item-meta">${userMsgs} msgs · ${new Date(parseInt(s.id.split('_')[1])).toLocaleDateString()}</div>`;
    item.onclick = () => { currentChatId = s.id; persistChats(); renderChat(); overlay.remove(); };
    list.appendChild(item);
  });
  const footer = document.createElement('div'); footer.className = 'modal-footer';
  footer.innerHTML = `<button class="modal-new-btn" onclick="this.closest('.modal-overlay').remove(); newChat()">+ New Chat</button>`;
  box.appendChild(footer); overlay.appendChild(box); document.body.appendChild(overlay);
}

function scrollToBottom(){ chatWindow.scrollTop = chatWindow.scrollHeight; document.getElementById('scrollBtn').classList.remove('visible'); }
function handleScroll(){
  const isScrolledUp = chatWindow.scrollHeight - chatWindow.scrollTop - chatWindow.clientHeight > 100;
  document.getElementById('scrollBtn').classList.toggle('visible', isScrolledUp);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.querySelector('.modal-overlay')) document.querySelector('.modal-overlay').remove();
    else if (document.getElementById('lightbox').classList.contains('open')) closeLightbox({target: document.body});
    else if (chatPanel.classList.contains('open')) closeChat();
  }
});
</script>
