<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ZJ WEBSITE — Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    --cyan:      #00eaff;
    --cyan-lite: #7af5ff;
    --cyan-deep: #0077cc;
    --cyan-glow: rgba(0, 234, 255, 0.55);
    --gold:      #ffd700;
    --gold-lite: #ffe680;
    --gold-deep: #8a6f00;
    --gold-glow: rgba(255, 215, 0, 0.5);
    --silver:      #e8eef2;
    --silver-lite: #ffffff;
    --silver-mid:  #b8c4cc;
    --silver-dark: #6a7a84;
    --sidebar-w: 240px;
    --bg-0: #000;
    --bg-1: #0a0e12;
    --bg-2: #04060a;
    --border: #1f262c;
    --text: #f0f6fa;
    --muted: #7a8a94;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.light-theme {
    --bg-0: #f4f7fa;
    --bg-1: #ffffff;
    --bg-2: #e8eef2;
    --border: #c4d0d8;
    --text: #0a1014;
    --muted: #4a5560;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }
  
  /* BACKGROUND */
  .bg { position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at top left, #06222a 0%, transparent 55%),
                radial-gradient(ellipse at bottom right, #1a1400 0%, transparent 55%), var(--bg-0); }
  body.light-theme .bg {
    background: radial-gradient(ellipse at top left, #d6f0f5 0%, transparent 55%),
                radial-gradient(ellipse at bottom right, #fff5cc 0%, transparent 55%), var(--bg-0);
  }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,234,255,0.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,234,255,0.025) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%); }
  .orb { position: absolute; border-radius: 50%; filter: blur(110px); animation: float 15s infinite ease-in-out; }
  .orb1 { width: 480px; height: 480px; background: var(--cyan);   top: -140px;  left: -140px; opacity: 0.16; }
  .orb2 { width: 560px; height: 560px; background: var(--gold);   bottom: -180px; right: -120px; animation-delay: -5s; opacity: 0.14; }
  .orb3 { width: 340px; height: 340px; background: var(--silver); top: 45%; left: 48%; opacity: 0.07; animation-delay: -9s; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-50px) scale(1.1); } }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 50;
    padding: 22px 16px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0d1014 0%, #040608 55%, #000 100%);
    border-right: 1px solid var(--border);
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.04), 8px 0 40px rgba(0,0,0,0.85);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
  body.light-theme .sidebar { background: linear-gradient(180deg, #ffffff 0%, #f4f7fa 55%, #e8eef2 100%); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand-logo { width: 42px; height: 42px; border-radius: 12px;
    background: radial-gradient(circle at 30% 25%, #fff7c2, var(--gold) 45%, var(--gold-deep) 100%);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -3px 8px rgba(0,0,0,0.45), 0 4px 20px var(--gold-glow);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #2a1e00; font-size: 18px; letter-spacing: -1px; font-family: Georgia, serif; }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 45%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .nav-label { font-size: 10px; letter-spacing: 2.5px; color: #4a5560; text-transform: uppercase; margin: 14px 8px 10px; }
  .nav-item { display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; margin-bottom: 4px; border-radius: 10px;
    color: #8a9aa4; font-size: 13.5px; font-weight: 500; cursor: pointer;
    text-decoration: none; transition: all 0.2s ease; border: 1px solid transparent; background: transparent; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { color: #ffffff; background: rgba(255,255,255,0.06); }
  .nav-item.active { color: #ffffff; background: linear-gradient(180deg, rgba(255,215,0,0.16), rgba(255,215,0,0.03)); border: 1px solid rgba(255,215,0,0.45); }
  .sidebar-footer { margin-top: auto; padding: 14px; border-radius: 12px;
    background: linear-gradient(145deg, #0d1014, #000); border: 1px solid var(--border); font-size: 11px; color: #5a6a74; text-align: center; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan); margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* TOP BAR */
  .topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: 62px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
    background: linear-gradient(180deg, rgba(10,14,18,0.95) 0%, rgba(0,0,0,0.92) 100%);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); transition: left 0.35s ease; }
  body.light-theme .topbar { background: rgba(255,255,255,0.95); }
  .menu-toggle { display: none; background: transparent; border: 1px solid #2a3038; color: var(--silver); padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-right: 14px; }
  .page-title { font-size: 14px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .clock { font-family: 'Courier New', monospace; font-size: 13px; color: var(--cyan); padding: 6px 14px; border-radius: 8px; background: rgba(0,6,10,0.8); border: 1px solid #1a3038; }
  .theme-toggle { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: var(--silver); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--silver-mid); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #1a2028; font-size: 13px; }

  /* MAIN */
  .main { position: relative; z-index: 2; margin-left: var(--sidebar-w); padding: 90px 26px 160px; transition: margin-left 0.35s ease; }
  .hero { text-align: center; margin-bottom: 34px; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 40%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  body.light-theme .hero h1 { background: linear-gradient(180deg, #0a1014 0%, #4a5560 40%, var(--gold-deep) 100%); -webkit-background-clip: text; }
  .hero h2 { margin: 0; font-size: 13px; letter-spacing: 4px; color: var(--cyan); font-weight: 600; text-transform: uppercase; }

  /* PANEL */
  .panel { max-width: 1220px; margin: 0 auto; padding: 26px; border-radius: 22px; background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-0) 100%); border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
  body.light-theme .panel { box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .panel-title { font-size: 12px; letter-spacing: 3px; color: var(--muted); font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .panel-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .panel-badge { font-size: 10px; letter-spacing: 1.5px; padding: 5px 12px; border-radius: 20px; color: var(--cyan); background: rgba(0,234,255,0.06); border: 1px solid rgba(0,234,255,0.28); }

  /* GRID */
  .main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 25px; flex-wrap: wrap; }

  /* FRAME */
  .frame { width: 320px; height: 550px; border-radius: 16px; border: 2px solid #c0c0c0; overflow: hidden; background: linear-gradient(180deg, #0c1014 0%, #030608 100%); box-shadow: 0 0 25px rgba(0,0,0,0.5); }
  body.light-theme .frame { background: #ffffff; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1a2025; }
  .card-title { font-size: 12px; letter-spacing: 2.5px; font-weight: 700; text-transform: uppercase; color: #c4d0d8; display: flex; align-items: center; gap: 8px; }
  body.light-theme .card-title { color: #2a3038; }
  .card-title .dot { width: 7px; height: 7px; border-radius: 50%; }
  .card-title.silver .dot { background: var(--silver); box-shadow: 0 0 10px var(--silver); }
  .card-title.gold   .dot { background: var(--gold);   box-shadow: 0 0 10px var(--gold); }
  .card-title.cyan   .dot { background: var(--cyan);   box-shadow: 0 0 10px var(--cyan); }
  .card-action-btn { background: rgba(255,255,255,0.06); border: 1px solid #2a3038; color: var(--silver-mid); padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 9px; font-weight: 700; }

  /* CALCULATOR */
  .calc { background: linear-gradient(145deg, #1a1a1a, #0d0d0d); display: flex; flex-direction: column; }
  body.light-theme .calc { background: #f4f7fa; }
  .calc-body { padding: 12px 15px 15px; display:flex; flex-direction:column; flex:1; }
  .calc-display { width: 100%; height: 65px; background: #000; color: #fff; border: 1px solid #00eaff; border-radius: 10px; font-size: 26px; text-align: right; padding: 10px 12px; margin-bottom: 8px; outline: none; }
  .calc-history { height: 60px; overflow-y: auto; margin-bottom: 10px; padding: 4px 8px; background: rgba(0,0,0,0.5); border: 1px solid #1a2025; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 11.5px; color: #7a9aa4; text-align: right; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
  .calc button { border-radius: 10px; border: 1px solid #c0c0c0; font-size: 17px; font-weight: 600; cursor: pointer; }
  .btn-num    { background: linear-gradient(180deg, #2a3238 0%, #141a1f 50%, #060a0d 100%); color: #fff; }
  .btn-op     { background: linear-gradient(145deg, #00aaff, #0077cc); color: #fff; }
  .btn-silver { background: linear-gradient(180deg, #d9d9d9 0%, #a8a8a8 50%, #6a7a84 100%); color: #000; }
  .btn-equal  { background: linear-gradient(180deg, #fff0a0 0%, #ffd700 50%, #8a6f00 100%); color: #2a1e00; grid-column: span 2; font-size: 20px; }

  /* SLIDER */
  .slider { display: flex; flex-direction: column; border-color: #ffd700; }
  .slider .slider-wrap { flex: 1; overflow: hidden; }
  .slides { display: flex; width: max-content; height: 100%; animation: slideRight 8s linear infinite; }
  .slides img { width: 320px; height: 500px; object-fit: cover; flex-shrink: 0; }
  @keyframes slideRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }

  /* WEATHER */
  .weather { display: flex; flex-direction: column; border-color: #00eaff; }
  .weather .inner { padding: 18px; display: flex; flex-direction: column; flex: 1; }
  .weather input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #1a3a44; background: #000; color: #fff; margin-bottom: 10px; outline: none; }
  .weather button { width: 100%; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(180deg, #7af5ff 0%, #00eaff 45%, #0077cc 100%); color: #001418; font-weight: 700; cursor: pointer; }
  .temp { font-size: 52px; font-weight: 800; margin: 20px 0 10px; text-align: center; color: #fff; }
  body.light-theme .temp { color: #0077cc; }
  .w-info { font-size: 13px; color: #c0c0c0; text-align: center; }
  body.light-theme .w-info { color: #4a5560; }

  /* CHAT FAB */
  .chat-fab { position: fixed; bottom: calc(60px + var(--safe-bottom)); right: 26px; width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer; z-index: 40; background: radial-gradient(circle at 30% 25%, #7af5ff, #00eaff 45%, #0077cc 100%); display: flex; align-items: center; justify-content: center; color: #001418; }
  .chat-fab svg { width: 26px; height: 26px; }

  /* FULL SCREEN CHAT */
  .chat-panel { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: #000; opacity: 0; pointer-events: none; transform: scale(0.96); transition: all 0.3s; }
  body.light-theme .chat-panel { background: #f4f7fa; color: #0a1014; }
  .chat-panel.open { opacity: 1; pointer-events: auto; transform: scale(1); }
  .chat-head { padding: 18px 34px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a2025; background: rgba(10,14,18,0.9); }
  body.light-theme .chat-head { background: #ffffff; }
  .chat-window { flex: 1; overflow-y: auto; padding: 30px max(34px, calc((100vw - 900px) / 2)); display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 70%; padding: 13px 18px; border-radius: 16px; font-size: 14.5px; }
  .msg.bot { align-self: flex-start; background: #0a2228; border: 1px solid #104a58; color: #d8f6ff; }
  body.light-theme .msg.bot { background: #ffffff; color: #0a1014; border-color: #c4d0d8; }
  .msg.user { align-self: flex-end; background: #ffffff; color: #0a1014; font-weight: 600; }
  .chat-input-area { padding: 18px max(34px, calc((100vw - 900px) / 2)) calc(26px + var(--safe-bottom)); border-top: 1px solid #0a2026; }
  .chat-input-row { display: flex; gap: 12px; max-width: 900px; margin: 0 auto; }
  .chat-input-row input { flex: 1; padding: 15px 20px; border-radius: 14px; border: 1px solid #104a58; background: #000; color: #fff; outline: none; }
  .chat-send { padding: 15px 30px; border-radius: 14px; border: none; background: #00eaff; color: #001418; font-weight: 800; cursor: pointer; }

  /* ==========================================
     📱 MOBILE RESPONSIVENESS (STACKS ON PHONE) 
     ========================================== */
  @media (max-width: 960px) {
    :root { --sidebar-w: 0px; }
    .sidebar { transform: translateX(-100%); width: 260px; }
    .sidebar.open { transform: translateX(0); }
    .topbar { left: 0; padding: 0 16px; height: 58px; }
    .menu-toggle { display: block; }
    .main { margin-left: 0; padding: 80px 12px 120px; }
    
    /* Stack layout for mobile */
    .main-layout { flex-direction: column; align-items: center; gap: 16px; }
    
    /* Make cards full width on mobile */
    .frame { width: 100%; max-width: 100%; height: auto; min-height: 480px; }
    .frame.calc { min-height: 520px; }
    .slides img { width: 100vw; height: 100%; }
    
    /* Mobile Chat Adjustments */
    .chat-head { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
    .chat-window { padding: 20px 14px; }
    .msg { max-width: 88%; font-size: 14px; padding: 11px 15px; }
    .chat-input-area { padding: 14px 14px calc(20px + var(--safe-bottom)); }
    .chat-input-row input { padding: 13px 16px; font-size: 16px; }
    .chat-send { padding: 13px 18px; font-size: 13px; }
    .chat-fab { right: 16px; bottom: calc(70px + var(--safe-bottom)); width: 56px; height: 56px; }
  }
</style>
</head>
<body>

<div class="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-logo">ZJ</div><div class="brand-name">ZJ WEBSITE</div></div>
  <div class="nav-label">Menu</div>
  <button class="nav-item active" onclick="scrollToSection()">Dashboard</button>
  <button class="nav-item" onclick="focusCalc()">Calculator</button>
  <button class="nav-item" onclick="openChat()">Chatbot</button>
  <button class="nav-item" onclick="focusWeather()">Weather</button>
  <div class="sidebar-footer"><span class="status-dot"></span>Online</div>
</aside>

<!-- TOP BAR -->
<header class="topbar">
  <div style="display:flex;align-items:center;">
    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="page-title">Dashboard</div>
  </div>
  <div class="topbar-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
    <div class="clock" id="clock">--:--:--</div>
    <div class="avatar">ZJ</div>
  </div>
</header>

<main class="main">
  <div class="hero"><h1>Welcome to My Website</h1><h2>This is "ZJ WEBSITE"</h2></div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Control Center</div>
      <div class="panel-badge"><span class="status-dot"></span>LIVE</div>
    </div>

    <div class="main-layout">
      <!-- CALCULATOR -->
      <div class="frame calc" id="calcCard">
        <div class="card-head"><div class="card-title silver"><span class="dot"></span>Calculator</div></div>
        <div class="calc-body">
          <input type="text" id="calcDisplay" class="calc-display" readonly value="0">
          <div class="calc-history" id="calcHistory"><div class="empty-hint">No calculations yet</div></div>
          <div class="calc-grid">
            <button class="btn-silver" onclick="clearCalc()">AC</button>
            <button class="btn-silver" onclick="delChar()">DEL</button>
            <button class="btn-silver" onclick="appendChar('%')">%</button>
            <button class="btn-op" onclick="appendChar('/')">÷</button>
            <button class="btn-num" onclick="appendChar('7')">7</button>
            <button class="btn-num" onclick="appendChar('8')">8</button>
            <button class="btn-num" onclick="appendChar('9')">9</button>
            <button class="btn-op" onclick="appendChar('*')">×</button>
            <button class="btn-num" onclick="appendChar('4')">4</button>
            <button class="btn-num" onclick="appendChar('5')">5</button>
            <button class="btn-num" onclick="appendChar('6')">6</button>
            <button class="btn-op" onclick="appendChar('-')">-</button>
            <button class="btn-num" onclick="appendChar('1')">1</button>
            <button class="btn-num" onclick="appendChar('2')">2</button>
            <button class="btn-num" onclick="appendChar('3')">3</button>
            <button class="btn-op" onclick="appendChar('+')">+</button>
            <button class="btn-num" onclick="appendChar('0')">0</button>
            <button class="btn-num" onclick="appendChar('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
          </div>
        </div>
      </div>

      <!-- SLIDER -->
      <div class="frame slider">
        <div class="card-head"><div class="card-title gold"><span class="dot"></span>Gallery</div></div>
        <div class="slider-wrap">
          <div class="slides">
            <img src="ZJPP.jpeg" alt="ZJ"><img src="bmw.jpeg" alt="BMW">
            <img src="ZJPP.jpeg" alt="ZJ"><img src="bmw.jpeg" alt="BMW">
          </div>
        </div>
      </div>

      <!-- WEATHER -->
      <div class="frame weather" id="weatherCard">
        <div class="card-head"><div class="card-title cyan"><span class="dot"></span>Weather</div></div>
        <div class="inner">
          <input type="text" id="cityInput" placeholder="Hyderabad">
          <button onclick="getWeather()">GET WEATHER</button>
          <div class="temp" id="temp">--°</div>
          <div class="w-info" id="wDetails">Enter city name</div>
        </div>
      </div>
    </div>
  </div>
</main>

<button class="chat-fab" id="chatFab" onclick="openChat()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<!-- FULL-SCREEN CHAT -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <div class="chat-head-left">
      <div class="chat-avatar" style="width:46px; height:46px; border-radius:50%; background:#00eaff; display:flex; align-items:center; justify-content:center; font-weight:900; color:#001418;">ZJ</div>
      <div><div class="chat-name">ZJ Chatbot</div><div class="chat-sub" style="color:#00eaff; font-size:12px;"><span class="status-dot"></span>Online</div></div>
    </div>
    <button class="chat-close" onclick="closeChat()" style="background:transparent; border:1px solid #555; color:#fff; padding:8px 12px; border-radius:10px; cursor:pointer;">CLOSE</button>
  </div>
  <div class="chat-window" id="chatWindow"></div>
  <div class="chat-input-area">
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="chat-send" onclick="sendMessage()">SEND</button>
    </div>
  </div>
</div>

<script>
/* THEME */
(function initTheme(){
  if (localStorage.getItem('zj_theme') === 'light') {
    document.body.classList.add('light-theme');
    document.getElementById('themeToggle').textContent = '☀️';
  }
})();
function toggleTheme(){
  const isLight = document.body.classList.toggle('light-theme');
  localStorage.setItem('zj_theme', isLight ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
}

/* CLOCK */
function tickClock(){
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(tickClock, 1000); tickClock();

/* CALCULATOR */
const display = document.getElementById('calcDisplay');
function appendChar(c){ if(display.value==='0' && c!=='.') display.value=c; else display.value+=c; }
function clearCalc(){ display.value='0'; }
function delChar(){ display.value=display.value.slice(0,-1) || '0'; }
function calculate(){
  try { display.value = eval(display.value.replace(/%/g,'/100')); } 
  catch { display.value = 'Error'; }
}

/* WEATHER */
async function getWeather(){
  const city = document.getElementById('cityInput').value.trim() || 'Hyderabad';
  const tempEl = document.getElementById('temp'); const detEl = document.getElementById('wDetails');
  tempEl.textContent = '...'; detEl.textContent = 'Loading...';
  try {
    const res = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
    const data = await res.json(); const curr = data.current_condition[0];
    tempEl.textContent = curr.temp_C + '°C';
    detEl.innerHTML = `<strong>${city.toUpperCase()}</strong><br>${curr.weatherDesc[0].value}`;
  } catch { tempEl.textContent = '--°'; detEl.textContent = 'Failed to fetch'; }
}
getWeather();

/* CHATBOT */
const chatWindow = document.getElementById('chatWindow');
const chatInput  = document.getElementById('chatInput');
const chatPanel  = document.getElementById('chatPanel');
const chatFab    = document.getElementById('chatFab');
const BOT_API    = '/chat';
const WELCOME_MSG = "Hi! I'm ZJ Bot 👋 Ask me anything.";

let chatSessions  = JSON.parse(localStorage.getItem('zj_chat_sessions') || '[]');
let currentChatId = localStorage.getItem('zj_current_chat') || null;

function persistChats(){
  localStorage.setItem('zj_chat_sessions', JSON.stringify(chatSessions));
  localStorage.setItem('zj_current_chat', currentChatId || '');
}
function getCurrentSession(){ return chatSessions.find(s => s.id === currentChatId) || null; }
function createNewSession(){
  const id = 'chat_' + Date.now();
  const session = { id, title: 'New Chat', messages: [{ sender: 'bot', text: WELCOME_MSG }] };
  chatSessions.unshift(session); currentChatId = id; persistChats(); return session;
}
function renderChat(){
  chatWindow.innerHTML = '';
  const session = getCurrentSession(); if (!session) return;
  session.messages.forEach(m => {
    const div = document.createElement('div'); div.className = 'msg ' + m.sender; div.textContent = m.text; chatWindow.appendChild(div);
  });
  chatWindow.scrollTop = chatWindow.scrollHeight;
}
function pushMessage(sender, text){
  const session = getCurrentSession(); if (session) session.messages.push({ sender, text });
  persistChats();
  const div = document.createElement('div'); div.className = 'msg ' + sender; div.textContent = text; chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}
function openChat(){
  chatPanel.classList.add('open'); chatFab.style.display = 'none'; document.body.style.overflow = 'hidden';
  if (!currentChatId) { createNewSession(); renderChat(); }
  setTimeout(() => chatInput.focus(), 320);
}
function closeChat(){
  chatPanel.classList.remove('open'); chatFab.style.display = 'flex'; document.body.style.overflow = '';
}
async function sendMessage(){
  const text = chatInput.value.trim(); if (!text) return;
  if (!currentChatId) { createNewSession(); renderChat(); }
  pushMessage('user', text); chatInput.value = '';

  const typingEl = document.createElement('div'); typingEl.className = 'msg bot typing'; typingEl.textContent = 'ZJ is typing...';
  chatWindow.appendChild(typingEl); chatWindow.scrollTop = chatWindow.scrollHeight;

  try {
    const res = await fetch(BOT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
    const data = await res.json(); typingEl.remove(); pushMessage('bot', data.reply || 'No response');
  } catch {
    typingEl.remove(); pushMessage('bot', '⚠️ Cannot reach chatbot server.');
  }
}
</script>
