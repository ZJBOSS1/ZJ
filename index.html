<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>ZJ WEBSITE — Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    /* Dark Theme (Default) */
    --cyan: #00eaff; --cyan-lite: #7af5ff; --cyan-deep: #0077cc;
    --cyan-glow: rgba(0,234,255,0.55);
    --gold: #ffd700; --gold-lite: #ffe680; --gold-deep: #8a6f00;
    --gold-glow: rgba(255,215,0,0.5);
    --silver: #e8eef2; --silver-mid: #b8c4cc; --silver-dark: #6a7a84;
    
    --sidebar-w: 240px;
    --bg-0: #000;
    --bg-1: #0a0e12;
    --bg-2: #04060a;
    --border: #1f262c;
    --text: #f0f6fa;
    --muted: #7a8a94;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Light Theme - Silver, Black, Cyan, Gold */
  body.light-theme {
    --bg-0: #F1F5F9; /* Light Silver background */
    --bg-1: #FFFFFF; /* Clean white cards */
    --bg-2: #F8FAFC; /* Very soft silver for secondary panels */
    --border: #CBD5E1; /* Crisp Silver border */
    --text: #0F172A; /* Deep Black/Slate text */
    --muted: #64748B; /* Muted Slate for secondary text */
    --cyan: #0EA5E9; /* Vibrant Cyan/Sky Blue */
    --cyan-glow: rgba(14, 165, 233, 0.2);
    --gold: #F59E0B; /* Rich Gold */
    --gold-glow: rgba(245, 158, 11, 0.2);
    --silver: #475569;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-0); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }
  button { font-family: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .orb, .slides, .status-dot { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }

  /* BACKGROUND */
  .bg { position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at top left, #06222a 0%, transparent 55%),
                radial-gradient(ellipse at bottom right, #1a1400 0%, transparent 55%), var(--bg-0); }
  body.light-theme .bg {
    background: radial-gradient(ellipse at top left, #E0F2FE 0%, transparent 55%),
                radial-gradient(ellipse at bottom right, #FEF3C7 0%, transparent 55%), var(--bg-0); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,234,255,0.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,234,255,0.025) 1px, transparent 1px);
    background-size: 46px 46px; }
  body.light-theme .grid { opacity: 0.4; }
  .orb { position: absolute; border-radius: 50%; filter: blur(110px); animation: float 15s infinite ease-in-out; }
  .orb1 { width: 480px; height: 480px; background: var(--cyan); top: -140px; left: -140px; opacity: 0.16; }
  .orb2 { width: 560px; height: 560px; background: var(--gold); bottom: -180px; right: -120px; animation-delay: -5s; opacity: 0.14; }
  .orb3 { width: 340px; height: 340px; background: var(--silver); top: 45%; left: 48%; opacity: 0.07; animation-delay: -9s; }
  body.light-theme .orb { opacity: 0.1; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-50px) scale(1.1); } }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 50;
    padding: 22px 16px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0d1014 0%, #040608 55%, #000 100%);
    border-right: 1px solid var(--border); box-shadow: 8px 0 40px rgba(0,0,0,0.85);
    transition: transform 0.35s ease; }
  body.light-theme .sidebar { background: #FFFFFF; box-shadow: 4px 0 24px rgba(15,23,42,0.04); border-right-color: #CBD5E1; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand-logo { width: 42px; height: 42px; border-radius: 12px;
    background: radial-gradient(circle at 30% 25%, #fff7c2, var(--gold) 45%, var(--gold-deep) 100%);
    display: flex; align-items: center; justify-content: center; font-weight: 900; color: #2a1e00; font-family: Georgia, serif;
    box-shadow: 0 4px 20px var(--gold-glow); }
  body.light-theme .brand-logo { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: #fff; box-shadow: 0 4px 14px var(--cyan-glow); }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 45%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  body.light-theme .brand-name { background: linear-gradient(180deg, #0F172A 0%, #475569 45%, #F59E0B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .nav-label { font-size: 10px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin: 14px 8px 10px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; margin-bottom: 4px; border-radius: 10px;
    color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; transition: all 0.2s ease; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
  body.light-theme .nav-item:hover { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; }
  .nav-item.active { color: var(--text); background: linear-gradient(180deg, rgba(255,215,0,0.16), rgba(255,215,0,0.03)); border: 1px solid rgba(255,215,0,0.45); }
  body.light-theme .nav-item.active { background: #F1F5F9; border-color: #0EA5E9; color: #0F172A; font-weight: 600; }

  /* TOP BAR */
  .topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: 62px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
    background: rgba(10,14,18,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); transition: left 0.35s ease; }
  body.light-theme .topbar { background: rgba(255,255,255,0.95); border-bottom: 1px solid var(--border); }
  .menu-toggle { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .clock { font-family: 'Courier New', monospace; font-size: 13px; color: var(--cyan); padding: 6px 14px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); letter-spacing: 1px; }
  body.light-theme .clock { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; font-weight: 600; }
  .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s ease; }
  .theme-toggle:hover { border-color: var(--cyan); color: var(--cyan); }

  /* MAIN */
  .main { position: relative; z-index: 2; margin-left: var(--sidebar-w); padding: 90px 26px 100px; transition: margin-left 0.35s ease; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 900; text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, var(--silver-mid) 40%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  body.light-theme .hero h1 { background: linear-gradient(180deg, #0F172A 0%, #475569 40%, #D97706 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero h2 { margin: 0; font-size: 13px; letter-spacing: 4px; color: var(--cyan); text-align: center; text-transform: uppercase; margin-bottom: 30px; }

  .panel { max-width: 1220px; margin: 0 auto; padding: 26px; border-radius: 22px; background: var(--bg-1); border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  body.light-theme .panel { box-shadow: 0 4px 24px rgba(15,23,42,0.06); }
  .main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 25px; flex-wrap: wrap; }

  /* FRAME / CARDS */
  .frame { width: 320px; height: 550px; border-radius: 16px; border: 2px solid #c0c0c0; overflow: hidden; background: var(--bg-2); display: flex; flex-direction: column; position: relative; }
  body.light-theme .frame { background: var(--bg-1); border-color: #CBD5E1; }
  .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  body.light-theme .card-head { border-bottom-color: #E2E8F0; }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.silver { background: var(--silver); box-shadow: 0 0 8px var(--silver); }
  .dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dot.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  /* Small round icon button */
  .icon-btn { width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid var(--silver-mid); color: var(--silver);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.18s ease; padding: 0; }
  body.light-theme .icon-btn { background: #F8FAFC; color: #475569; border-color: #CBD5E1; }
  .icon-btn:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); transform: scale(1.08); }
  body.light-theme .icon-btn:hover { color: #0EA5E9; border-color: #0EA5E9; background: #F0F9FF; }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* CALCULATOR */
  .calc-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
  .calc-display { width: 100%; height: 65px; background: #000; color: #fff; border: 1px solid var(--cyan);
    border-radius: 10px; font-size: 26px; text-align: right; padding: 10px; margin-bottom: 10px;
    font-family: 'Courier New', monospace; font-weight: 600; letter-spacing: 1px;
    box-shadow: inset 0 3px 12px rgba(0,0,0,0.9), 0 0 20px rgba(0,234,255,0.1); outline: none; }
  body.light-theme .calc-display { background: #0F172A; color: #0EA5E9; border-color: #0EA5E9; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
  .calc button { border-radius: 10px; border: 1px solid transparent; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.08s ease; display: flex; align-items: center; justify-content: center; }
  .calc button:active { transform: translateY(1px) scale(0.98); }
  
  .btn-num { background: linear-gradient(180deg, #2a3238 0%, #141a1f 100%); color: #fff; border-color: #2e3840; }
  .btn-num:hover { background: linear-gradient(180deg, #3a444c 0%, #20282f 100%); }
  body.light-theme .btn-num { background: #FFFFFF; color: #0F172A; border-color: #CBD5E1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  body.light-theme .btn-num:hover { background: #F1F5F9; }
  
  .btn-op { background: linear-gradient(180deg, #00aaff, var(--cyan-deep)); color: #fff; border-color: var(--cyan); }
  body.light-theme .btn-op { background: #0EA5E9; color: #fff; border-color: #0284C7; }
  
  .btn-silver { background: linear-gradient(180deg, #d9d9d9 0%, #a8a8a8 100%); color: #000; border-color: #c0c0c0; }
  body.light-theme .btn-silver { background: #F1F5F9; color: #0F172A; border-color: #CBD5E1; }
  
  .btn-equal { background: linear-gradient(180deg, #fff0a0 0%, var(--gold) 55%, var(--gold-deep) 100%); color: #2a1e00; grid-column: span 2; font-size: 20px; border-color: var(--gold); }
  body.light-theme .btn-equal { background: #F59E0B; color: #fff; border-color: #D97706; }

  /* SLIDER */
  .slider-wrap { flex: 1; overflow: hidden; position: relative; }
  .slides { display: flex; width: max-content; height: 100%; animation: slideRight 10s linear infinite; }
  .slides:hover { animation-play-state: paused; }
  .slides img { width: 320px; height: 100%; object-fit: cover; flex-shrink: 0; display: block; background: #1a1a1a; }
  .slides img.error { opacity: 0.35; }
  @keyframes slideRight { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }

  /* WEATHER */
  .weather-inner { padding: 18px; display: flex; flex-direction: column; flex: 1; }
  .weather-inner input { padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); margin-bottom: 10px; outline: none; font-family: inherit; }
  body.light-theme .weather-inner input { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; }
  .weather-inner input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,234,255,0.3); }
  body.light-theme .weather-inner input:focus { box-shadow: 0 0 0 3px rgba(14,165,233,0.15); border-color: #0EA5E9; }
  .weather-inner button { padding: 10px; border-radius: 10px; background: var(--cyan); color: #001418; font-weight: 800; letter-spacing: 1px; cursor: pointer; border: none; transition: all 0.15s ease; }
  body.light-theme .weather-inner button { background: #0EA5E9; color: #fff; }
  .weather-inner button:hover { box-shadow: 0 0 18px var(--cyan-glow); }
  .weather-inner button:disabled { opacity: 0.6; cursor: wait; }
  .temp { font-size: 52px; font-weight: 800; text-align: center; margin-top: 20px; text-shadow: 0 0 15px var(--cyan-glow); }
  body.light-theme .temp { color: #0F172A; text-shadow: none; }
  .w-details { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .w-details strong { color: var(--cyan); }
  body.light-theme .w-details strong { color: #0EA5E9; }
  .w-details.error { color: #ff5c5c; }
  .w-skeleton { display: inline-block; width: 60%; height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, #1a2025 0%, #2a3038 50%, #1a2025 100%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite; }
  body.light-theme .w-skeleton { background: linear-gradient(90deg, #CBD5E1 0%, #F1F5F9 50%, #CBD5E1 100%); background-size: 200% 100%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* CHAT FAB */
  .chat-fab { position: fixed; bottom: 30px; right: 26px; width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer; z-index: 40;
    background: radial-gradient(circle at 30% 25%, #7af5ff, var(--cyan) 45%, var(--cyan-deep) 100%);
    display: flex; align-items: center; justify-content: center; color: #001418;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -3px 8px rgba(0,0,0,0.4), 0 8px 30px var(--cyan-glow);
    transition: transform 0.2s ease; }
  body.light-theme .chat-fab { background: #0EA5E9; color: #fff; box-shadow: 0 4px 14px var(--cyan-glow); }
  .chat-fab:hover { transform: scale(1.08); }
  .chat-fab:active { transform: scale(0.95); }

  /* CHAT PANEL */
  .chat-panel { position: fixed; inset: 0; height: 100dvh; z-index: 100; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at top, rgba(8,16,24,0.98) 0%, rgba(0,0,0,0.99) 60%), var(--bg-0);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  body.light-theme .chat-panel { background: #F1F5F9; }
  .chat-panel.open { opacity: 1; pointer-events: auto; }

  .chat-head { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--border); background: var(--bg-1); flex-shrink: 0; flex-wrap: wrap; }
  body.light-theme .chat-head { background: #FFFFFF; border-bottom-color: #CBD5E1; }
  .chat-head-info { display: flex; align-items: center; gap: 10px; }
  .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #7af5ff, var(--cyan) 50%, var(--cyan-deep));
    display: flex; align-items: center; justify-content: center; font-weight: 900; color: #001418; box-shadow: 0 0 18px var(--cyan-glow); }
  body.light-theme .chat-avatar { background: #0EA5E9; color: #fff; box-shadow: none; }
  .chat-name { font-weight: 800; font-size: 16px; }
  .chat-sub { color: var(--cyan); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  body.light-theme .chat-sub { color: #0EA5E9; }

  /* CHAT ACTION BUTTONS */
  .chat-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chat-action-btn { display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; transition: all 0.18s ease; border: 1px solid; background: transparent; }
  .chat-action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  
  .chat-action-btn.gold { border-color: rgba(255,215,0,0.5); color: var(--gold-lite); background: rgba(255,215,0,0.06); }
  .chat-action-btn.gold:hover { color: #fff; border-color: var(--gold); background: rgba(255,215,0,0.16); box-shadow: 0 0 18px var(--gold-glow); }
  body.light-theme .chat-action-btn.gold { color: #B45309; border-color: #FCD34D; background: #FEF3C7; }
  body.light-theme .chat-action-btn.gold:hover { background: #FDE68A; box-shadow: none; }
  
  .chat-action-btn.cyan { border-color: rgba(0,234,255,0.4); color: var(--cyan-lite); background: rgba(0,234,255,0.06); }
  .chat-action-btn.cyan:hover { color: #fff; border-color: var(--cyan); background: rgba(0,234,255,0.16); box-shadow: 0 0 18px var(--cyan-glow); }
  body.light-theme .chat-action-btn.cyan { color: #0369A1; border-color: #7DD3FC; background: #E0F2FE; }
  body.light-theme .chat-action-btn.cyan:hover { background: #BAE6FD; box-shadow: none; }
  
  .chat-action-btn.danger { border-color: rgba(255,92,92,0.4); color: #ff9a9a; background: rgba(255,92,92,0.06); padding: 8px 10px; }
  .chat-action-btn.danger:hover { color: #fff; border-color: #ff5c5c; background: rgba(255,92,92,0.16); box-shadow: 0 0 18px rgba(255,92,92,0.5); }
  body.light-theme .chat-action-btn.danger { color: #B91C1C; border-color: #FCA5A5; background: #FEE2E2; }
  body.light-theme .chat-action-btn.danger:hover { background: #FECACA; box-shadow: none; }

  .chat-close { display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s ease; background: transparent; border: 1px solid var(--border); color: var(--text); }
  .chat-close:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
  body.light-theme .chat-close { border-color: #CBD5E1; color: #64748B; }
  body.light-theme .chat-close:hover { border-color: #0EA5E9; color: #0EA5E9; box-shadow: none; }

  /* CHAT WINDOW */
  .chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .chat-window::-webkit-scrollbar { width: 6px; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
  .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.bot { align-self: flex-start; align-items: flex-start; }
  .msg { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.45; position: relative; word-wrap: break-word; }
  .msg.bot { background: var(--bg-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  body.light-theme .msg.bot { background: #fff; border-color: #CBD5E1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .msg.user { background: var(--cyan-lite); color: #001418; font-weight: 600; border-bottom-right-radius: 4px; }
  body.light-theme .msg.user { background: #0EA5E9; color: #fff; }
  .typing { font-style: italic; color: var(--muted); font-size: 13px; }
  .msg-actions { margin-top: 4px; display: flex; gap: 8px; }
  .copy-btn { background: transparent; border: none; color: var(--muted); font-size: 11px; cursor: pointer;
    display: flex; align-items: center; gap: 4px; padding: 0; }
  .copy-btn:hover { color: var(--cyan); }

  /* CHAT INPUT AREA */
  .chat-input-area { padding: 15px 20px calc(15px + var(--safe-bottom)); background: var(--bg-1); border-top: 1px solid var(--border); flex-shrink: 0; }
  body.light-theme .chat-input-area { background: #fff; border-top-color: #CBD5E1; }
  .chat-input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; width: 100%; }
  .chat-input-row input { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-0); color: var(--text); font-size: 16px; outline: none; font-family: inherit; transition: border-color 0.15s; }
  body.light-theme .chat-input-row input { background: #F8FAFC; border-color: #CBD5E1; color: #0F172A; }

<script>
/* ============ SIDEBAR / NAV ============ */
function scrollToSection(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }

function focusWeather(){ document.getElementById('weatherCard').scrollIntoView({behavior:'smooth', block:'center'}); }

/* ============ THEME ============ */
function toggleTheme(){

  localStorage.setItem('zj_theme', isLight ? 'light' : 'dark');

}
if (localStorage.getItem('zj_theme') === 'light') {
  document.body.classList.add('light-theme');
  document.getElementById('themeToggle').textContent = '☀️';
}

/* ============ CLOCK ============ */
setInterval(() => {
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}, 1000);
(function initClock(){ const d = new Date(); const pad = n => String(d.getHours()).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; })();

/* ============ SAFE CALCULATOR ============ */
const display = document.getElementById('calcDisplay');
let calcHistory = JSON.parse(localStorage.getItem('zj_calc_history') || '[]');

function saveCalcHistory(){
  localStorage.setItem('zj_calc_history', JSON.stringify(calcHistory.slice(-50)));
}
function appendChar(c){
  const v = display.value;
  if (v === '0' && c !== '.') display.value = c;
  else if (c === '.' && /\.\d*$/.test(v)) return;
  else display.value = v + c;
}
function clearCalc(){ display.value = '0'; }
function delChar(){ display.value = display.value.slice(0,-1) || '0'; }

/* Safe evaluator — handles × and ÷ */
function safeEval(input){
  if (!/^[\d+\-*/().%×÷\s]+$/.test(input)) throw new Error('Invalid characters');
  const expr = input.replace(/%/g, '/100').replace(/×/g, '*').replace(/÷/g, '/');
  const tokens = expr.match(/\d+\.?\d*|[+\-*/()]/g);
  if (!tokens) throw new Error('Empty expression');
  const prec = { '+':1, '-':1, '*':2, '/':2 };
  const out = [], ops = [];
  let prev = null;
  for (const t of tokens) {
    if (/^\d/.test(t)) out.push(parseFloat(t));
    else if (t === '(') ops.push(t);
    else if (t === ')') {
      while (ops.length && ops[ops.length-1] !== '(') out.push(ops.pop());
      if (!ops.length) throw new Error('Mismatched parens');
      ops.pop();
    } else {
      if (t === '-' && (prev === null || prev === '(' || prec[prev])) out.push(0);
      while (ops.length && prec[ops[ops.length-1]] >= prec[t]) out.push(ops.pop());
      ops.push(t);
    }
    prev = t;
  }
  while (ops.length) { const op = ops.pop(); if (op === '(') throw new Error('Bad expression'); out.push(op); }
  const stack = [];
  for (const t of out) {
    if (typeof t === 'number') { stack.push(t); continue; }
    const b = stack.pop(), a = stack.pop();
    if (a === undefined || b === undefined) throw new Error('Bad expression');
    let r;
    switch (t) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) throw new Error('Divide by zero'); r = a / b; break;
    }
    stack.push(r);
  }
  if (stack.length !== 1) throw new Error('Bad expression');
  const result = stack[0];
  if (!isFinite(result)) throw new Error('Math error');
  return Math.round(result * 1e12) / 1e12;
}

function calculate(){
  try {
    const original = display.value;
    if (!original || original === '0') return;
    const result = safeEval(original);
    display.value = result;
    calcHistory.push({ expr: original, result, ts: Date.now() });
    if (calcHistory.length > 50) calcHistory.shift();
    saveCalcHistory();
  } catch {
    display.value = 'Error';
    setTimeout(() => { if (display.value === 'Error') display.value = '0'; }, 1200);
  }
}

/* ============ KEYBOARD SUPPORT ============ */
document.addEventListener('keydown', (e) => {
  // Ignore if typing in an input, or if chat/modal is open
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (document.getElementById('chatPanel').classList.contains('open')) return;
  if (document.querySelector('.modal-overlay')) return;

  const key = e.key;
  if (/^[0-9.]$/.test(key)) { appendChar(key); e.preventDefault(); }
  else if (key === '+') { appendChar('+'); e.preventDefault(); }
  else if (key === '-') { appendChar('-'); e.preventDefault(); }
  else if (key === '*') { appendChar('×'); e.preventDefault(); }
  else if (key === '/') { appendChar('÷'); e.preventDefault(); }
  else if (key === '%') { appendChar('%'); e.preventDefault(); }
  else if (key === 'Enter' || key === '=') { calculate(); e.preventDefault(); }
  else if (key === 'Backspace') { delChar(); e.preventDefault(); }
  else if (key === 'Escape') { clearCalc(); e.preventDefault(); }
});

/* Calculator history modal (clock button) */
function openCalcHistory(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const box = document.createElement('div');
  box.className = 'modal-box';

  const head = document.createElement('div');
  head.className = 'modal-head';
  head.innerHTML = '<div class="modal-title">CALCULATOR HISTORY</div>';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Close history');
  closeBtn.onclick = () => overlay.remove();
  head.appendChild(closeBtn);
  box.appendChild(head);

  const list = document.createElement('div');
  list.className = 'modal-list';
  if (calcHistory.length === 0) {
    list.innerHTML = '<div class="modal-empty">No calculations yet.<br>Try some math!</div>';
  } else {
    calcHistory.slice().reverse().forEach(h => {
      const item = document.createElement('div');
      item.className = 'modal-item';
      item.innerHTML = `
        <div class="modal-item-title">${h.expr} = <span style="color:var(--gold);">${h.result}</span></div>
        <div class="modal-item-meta">${new Date(h.ts).toLocaleString()}</div>
      `;
      item.onclick = () => { display.value = String(h.result); overlay.remove(); };
      list.appendChild(item);
    });
  }
  box.appendChild(list);

  if (calcHistory.length > 0) {
    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const clearBtn = document.createElement('button');
    clearBtn.className = 'modal-new-btn danger';
    clearBtn.textContent = 'Clear All History';
    clearBtn.onclick = () => {
      if (!confirm('Clear all calculator history?')) return;
      calcHistory = []; saveCalcHistory(); overlay.remove();
    };
    footer.appendChild(clearBtn);
    box.appendChild(footer);
  }

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

/* ============ WEATHER (Open-Meteo API) ============ */
const WEATHER_TTL = 10 * 60 * 1000;
const weatherCache = {};
let weatherAbort = null;

// WMO Weather interpretation codes (WW)
const WMO_CODES = {
  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
  56: "Light freezing drizzle", 57: "Dense freezing drizzle", 61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
  66: "Light freezing rain", 67: "Heavy freezing rain", 71: "Slight snow fall", 73: "Moderate snow fall", 75: "Heavy snow fall",
  77: "Snow grains", 80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
  85: "Slight snow showers", 86: "Heavy snow showers", 95: "Thunderstorm", 96: "Thunderstorm with slight hail", 99: "Thunderstorm with heavy hail"
};

async function getWeather(){
  const input = document.getElementById('cityInput');
  const city = (input.value.trim() || 'Hyderabad');
  const tempEl = document.getElementById('temp');
  const detEl = document.getElementById('wDetails');
  const btn = document.getElementById('weatherBtn');

  // Force Pakistan country code for Hyderabad
  const countryCode = (city.toLowerCase() === 'hyderabad') ? '&countryCode=PK' : '';

  const cached = weatherCache[city.toLowerCase()];
  if (cached && Date.now() - cached.ts < WEATHER_TTL) {
    renderWeather(cached.data, city);
    return;
  }

  btn.disabled = true;
  tempEl.textContent = '...';
  detEl.className = 'w-details';
  detEl.innerHTML = '<span class="w-skeleton"></span><br><br><span class="w-skeleton"></span>';

  if (weatherAbort) weatherAbort.abort();
  weatherAbort = new AbortController();

  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json${countryCode}`, { signal: weatherAbort.signal });
    if (!geoRes.ok) throw new Error('Geocoding failed');
    const geoData = await geoRes.json();
    
    if (!geoData.results || geoData.results.length === 0) {
      throw new Error('City not found');
    }

    const loc = geoData.results[0];
    const lat = loc.latitude;
    const lon = loc.longitude;

    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m,apparent_temperature&timezone=auto`, { signal: weatherAbort.signal });
    if (!weatherRes.ok) throw new Error('Weather fetch failed');
    const weatherData = await weatherRes.json();

    weatherCache[city.toLowerCase()] = { data: { geo: loc, weather: weatherData }, ts: Date.now() };
    renderWeather({ geo: loc, weather: weatherData }, city);

  } catch (e) {
    if (e.name === 'AbortError') return;
    tempEl.textContent = '--°';
    detEl.className = 'w-details error';
    if (e.message === 'City not found') {
      detEl.innerHTML = '⚠️ City not found.<br>Please try another name.';
    } else {
      detEl.innerHTML = '⚠️ Failed to fetch weather.<br>Check connection and try again.';
    }
  } finally {
    btn.disabled = false;
  }
}

function renderWeather(data, cityName){
  const { geo, weather } = data;
  const current = weather.current_weather;
  const hourly = weather.hourly;
  
  const currentHour = current.time;
  const hourIndex = hourly.time.indexOf(currentHour);
  
  const humidity = hourIndex !== -1 ? hourly.relative_humidity_2m[hourIndex] : '--';
  const feelsLike = hourIndex !== -1 ? hourly.apparent_temperature[hourIndex] : current.temperature;
  
  const tempEl = document.getElementById('temp');
  const detEl = document.getElementById('wDetails');
  
  const displayName = geo.name + (geo.country ? `, ${geo.country}` : '');
  
  tempEl.textContent = Math.round(current.temperature) + '°C';
  detEl.className = 'w-details';
  detEl.innerHTML = `
    <strong>${displayName.toUpperCase()}</strong><br>
    ${WMO_CODES[current.weathercode] || 'Unknown'}<br>
    Feels: ${Math.round(feelsLike)}°C · Humidity: ${humidity}%<br>
    Wind: ${current.windspeed} km/h
  `;
}

getWeather();

/* ============ CHATBOT ============ */
const chatWindow = document.getElementById('chatWindow');
const chatInput  = document.getElementById('chatInput');
const chatPanel  = document.getElementById('chatPanel');
const chatFab    = document.getElementById('chatFab');
const scrollBtn  = document.getElementById('scrollBtn');
const BOT_API    = '/chat';
const WELCOME_MSG = "Hi! I'm ZJ Bot 👋 How can I help you today?";

let chatSessions  = JSON.parse(localStorage.getItem('zj_chat_sessions') || '[]');
let currentChatId = localStorage.getItem('zj_current_chat') || null;

if (chatSessions.length > 0 && !chatSessions.find(s => s.id === currentChatId)) {
  currentChatId = chatSessions[0].id;
} else if (chatSessions.length === 0) {
  currentChatId = null;
}

function persistChats(){
  localStorage.setItem('zj_chat_sessions', JSON.stringify(chatSessions));
  localStorage.setItem('zj_current_chat', currentChatId || '');
}
function getCurrentSession(){ return chatSessions.find(s => s.id === currentChatId) || null; }

function createNewSession(){
  const id = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const session = { id, title: 'New Chat', messages: [{ sender: 'bot', text: WELCOME_MSG }] };
  chatSessions.unshift(session);
  currentChatId = id;
  persistChats();
  return session;
}

function renderChat(){
  chatWindow.innerHTML = '';
  const session = getCurrentSession(); if (!session) return;
  session.messages.forEach(m => {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ' + m.sender;
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + m.sender;
    msgDiv.textContent = m.text;
    wrapper.appendChild(msgDiv);

    if (m.sender === 'bot') {
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(m.text);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`, 1800);
      };
      actions.appendChild(copyBtn);
      wrapper.appendChild(actions);
    }
    chatWindow.appendChild(wrapper);
  });
  scrollToBottom();
}

function pushMessage(sender, text){
  let session = getCurrentSession();
  if (!session) session = createNewSession();
  session.messages.push({ sender, text });
  persistChats();
  renderChat();
}

function openChat(){
  chatPanel.classList.add('open');
  chatFab.style.display = 'none';
  document.body.style.overflow = 'hidden';
  if (!currentChatId) createNewSession();
  renderChat();
  setTimeout(() => chatInput.focus(), 300);
}
function closeChat(){
  chatPanel.classList.remove('open');
  chatFab.style.display = 'flex';
  document.body.style.overflow = '';
}

async function sendMessage(){
  const text = chatInput.value.trim(); if (!text) return;
  if (!currentChatId) createNewSession();

  pushMessage('user', text);
  chatInput.value = '';

  const session = getCurrentSession();
  if (session && session.title === 'New Chat') {
    session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
    persistChats();
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper bot';
  const typingEl = document.createElement('div');
  typingEl.className = 'msg bot typing';
  typingEl.textContent = 'ZJ is typing...';
  wrapper.appendChild(typingEl);
  chatWindow.appendChild(wrapper);
  scrollToBottom();

  try {
    const res = await fetch(BOT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    wrapper.remove();
    pushMessage('bot', data.reply || 'No response');
  } catch {
    wrapper.remove();
    pushMessage('bot', '⚠️ Cannot reach server. Check connection.');
  }
}

/* NEW CHAT */
function newChat(){
  createNewSession();
  renderChat();
}

/* CLEAR CHAT (current session) */
function clearChat(){
  const session = getCurrentSession();
  if (!session) return;
  if (!confirm('Clear all messages in this chat?')) return;
  session.messages = [{ sender: 'bot', text: WELCOME_MSG }];
  session.title = 'New Chat';
  persistChats();
  renderChat();
}

/* CHAT HISTORY MODAL */
function showChatHistory(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const box = document.createElement('div');
  box.className = 'modal-box';

  const head = document.createElement('div');
  head.className = 'modal-head';
  head.innerHTML = '<div class="modal-title">CHAT HISTORY</div>';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.onclick = () => overlay.remove();
  head.appendChild(closeBtn);
  box.appendChild(head);

  const list = document.createElement('div');
  list.className = 'modal-list';

  if (chatSessions.length === 0) {
    list.innerHTML = '<div class="modal-empty">No chat history yet.<br>Start chatting to create one!</div>';
  } else {
    chatSessions.forEach(session => {
      const item = document.createElement('div');
      const isActive = session.id === currentChatId;
      item.className = 'modal-item' + (isActive ? ' active' : '');
      const ts = parseInt(session.id.split('_')[1]) || Date.now();
      const date = new Date(ts).toLocaleString();
      const userMsgs = session.messages.filter(m => m.sender === 'user').length;
      item.innerHTML = `
        <div class="modal-item-title">${session.title || 'Untitled'}</div>
        <div class="modal-item-meta">${userMsgs} message${userMsgs === 1 ? '' : 's'} · ${date}</div>
      `;
      item.onclick = () => {
        currentChatId = session.id;
        persistChats();
        renderChat();
        overlay.remove();
      };
      list.appendChild(item);
    });
  }
  box.appendChild(list);

  const footer = document.createElement('div');
  footer.className = 'modal-footer';
  const newBtn = document.createElement('button');
  newBtn.className = 'modal-new-btn';
  newBtn.textContent = '+ New Chat';
  newBtn.onclick = () => { overlay.remove(); newChat(); };
  footer.appendChild(newBtn);
  box.appendChild(footer);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

/* SCROLL HELPERS */
function scrollToBottom(){
  chatWindow.scrollTop = chatWindow.scrollHeight;
  scrollBtn.classList.remove('visible');
}
function handleScroll(){
  const isScrolledUp = chatWindow.scrollHeight - chatWindow.scrollTop - chatWindow.clientHeight > 100;
  scrollBtn.classList.toggle('visible', isScrolledUp);
}

/* ESC closes chat */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.querySelector('.modal-overlay')) {
      document.querySelector('.modal-overlay').remove();
    } else if (chatPanel.classList.contains('open')) {
      closeChat();
    }
  }
});
</script>
