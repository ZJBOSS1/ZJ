<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#00a3cc">
<title>ZJ Website — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300a3cc'/%3E%3Ctext x='50' y='68' font-size='50' font-family='Georgia' font-weight='900' text-anchor='middle' fill='white'%3EZJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  /* ===== VARIABLES ===== */
  :root {
    --cyan: #00a3cc; --cyan-lite: #33c2e8; --cyan-deep: #0077cc;
    --cyan-glow: rgba(0,163,204,0.2);
    --gold: #ffd700; --gold-lite: #ffe680; --gold-deep: #8a6f00;
    --gold-glow: rgba(255,215,0,0.2);
    --silver: #e8eef2; --silver-mid: #b8c4cc; --silver-dark: #6a7a84;
    --danger: #ef4444; --success: #10b981;

    /* Metallic Theme Colors */
    --metal-1: #1a1e24; --metal-2: #0d1014; --metal-3: #2a3038;
    --metal-shadow: inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -2px 5px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);

    --sidebar-w: 220px;
    --bg-0: #000000; --bg-1: #0a0e12; --bg-2: #121820;
    --border: #1f262c; --text: #f0f6fa; --muted: #7a8a94;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.light-theme {
    --bg-0: #F1F5F9; --bg-1: #FFFFFF; --bg-2: #F8FAFC;
    --border: #CBD5E1; --text: #0F172A; --muted: #64748B;
    --cyan: #0284C7; --cyan-lite: #38BDF8; --cyan-deep: #075985;
    --cyan-glow: rgba(2,132,199,0.15);
    --gold: #B45309; --gold-lite: #F59E0B; --gold-deep: #78350F;
    --gold-glow: rgba(245,158,11,0.15);
    --silver: #475569; --silver-mid: #94A3B8; --silver-dark: #64748B;
    
    --metal-1: #e2e8f0; --metal-2: #cbd5e1; --metal-3: #f8fafc;
    --metal-shadow: inset 0 2px 5px rgba(255,255,255,0.8), inset 0 -2px 5px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.1);
  }

  /* ===== RESET ===== */
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-0); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }

  /* ===== BACKGROUND ===== */
  .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at top left, #06222a 0%, transparent 50%), radial-gradient(ellipse at bottom right, #1a1400 0%, transparent 50%), var(--bg-0); }
  body.light-theme .bg { background: radial-gradient(ellipse at top left, #E0F2FE 0%, transparent 50%), radial-gradient(ellipse at bottom right, #FEF3C7 0%, transparent 50%), var(--bg-0); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,163,204,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,163,204,0.02) 1px, transparent 1px); background-size: 40px 40px; }
  body.light-theme .grid { opacity: 0.3; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); animation: float 20s infinite ease-in-out; }
  .orb1 { width: 400px; height: 400px; background: var(--cyan); top: -100px; left: -100px; opacity: 0.1; }
  .orb2 { width: 500px; height: 500px; background: var(--gold); bottom: -150px; right: -100px; opacity: 0.08; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-30px) scale(1.05); } }

  /* ===== TOAST ===== */
  .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--bg-1); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,0.3); animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.3s ease 2.7s forwards; display: flex; align-items: center; gap: 8px; max-width: 90vw; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(20px) scale(0.9); } }

  /* ===== SIDEBAR ===== */
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 45; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 50; padding: 20px 14px; display: flex; flex-direction: column; background: var(--bg-1); border-right: 1px solid var(--border); transition: transform 0.35s ease; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding-left: 4px; }
  .brand-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--cyan), var(--cyan-deep)); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; font-family: Georgia, serif; box-shadow: 0 4px 10px var(--cyan-glow); }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--text); }
  .nav-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 0 8px 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 4px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; transition: all 0.2s ease; }
  .nav-item:hover { color: var(--text); background: var(--bg-2); }
  .nav-item.active { color: var(--cyan); background: var(--bg-2); border-color: var(--cyan); }

  /* ===== TOPBAR ===== */
  .topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: 60px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--bg-1); border-bottom: 1px solid var(--border); transition: left 0.35s ease; }
  .menu-toggle { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .theme-toggle { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }

  /* ===== MAIN ===== */
  .main { position: relative; z-index: 2; margin-left: var(--sidebar-w); padding: 85px 20px 80px; transition: margin-left 0.35s ease; max-width: 1160px; margin-right: auto; }
  
  /* Live Digital Clock Next to Welcome */
  .hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; gap: 6px; }
  .hero-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .hero h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--text); }
  .digital-clock { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); background: var(--bg-2); padding: 4px 12px; border-radius: 8px; border: 1px solid var(--border); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
  .hero h2 { margin: 0; font-size: 12px; letter-spacing: 4px; color: var(--cyan); text-transform: uppercase; font-weight: 700; }

  .main-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

  /* ===== CARD (FRAMES) ===== */
  .frame { background: var(--bg-1); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); min-height: 320px; }
  body.light-theme .frame { box-shadow: 0 4px 20px rgba(15,23,42,0.05); }
  .card-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent); }
  .card-title { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); } 
  .dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); } 
  .dot.silver { background: var(--silver); box-shadow: 0 0 8px var(--silver); }
  .card-tools { display: flex; gap: 6px; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.2s; }
  .icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }

  /* ===== CALCULATOR (SIMPLE) ===== */
  .calc-body { padding: 16px; display: flex; flex-direction: column; flex: 1; gap: 8px; }
  .calc-display { width: 100%; height: 56px; background: var(--bg-0); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 24px; text-align: right; padding: 8px 12px; font-family: 'Share Tech Mono', monospace; font-weight: 700; outline: none; box-shadow: inset 0 3px 8px rgba(0,0,0,0.4); }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; min-height: 220px; }
  .calc-grid button { border-radius: 10px; border: 1px solid transparent; font-size: 18px; font-weight: 700; transition: all 0.1s; display: flex; align-items: center; justify-content: center; }
  .calc-grid button:active { transform: scale(0.96); }
  .btn-num { background: var(--bg-2); color: var(--text); border-color: var(--border); }
  .btn-op { background: var(--cyan); color: #fff; }
  .btn-silver { background: var(--border); color: var(--text); }
  .btn-equal { background: var(--gold); color: #fff; grid-column: span 2; font-size: 22px; }
  body.light-theme .btn-equal { color: #1a1400; }

  /* ===== WEATHER ===== */
  .weather-inner { padding: 14px 16px; display: flex; flex-direction: column; flex: 1; gap: 12px; }
  .weather-search { display: flex; gap: 8px; }
  .weather-search input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text); font-size: 13px; outline: none; }
  .weather-search button { padding: 0 14px; border-radius: 8px; background: var(--cyan); color: #fff; font-weight: 800; border: none; font-size: 14px; }
  .weather-main { display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; justify-content: center; min-height: 100px; }
  .weather-icon-large { font-size: 48px; margin-bottom: 4px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
  .temp { font-size: 42px; font-weight: 900; line-height: 1; }
  .w-desc { font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--cyan); }
  .w-loc { font-size: 12px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .weather-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-box { background: var(--bg-2); border: 1px solid var(--border); padding: 8px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); }
  .stat-box strong { color: var(--text); font-size: 13px; margin-top: 2px; }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
  .fc-day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--border); }
  .fc-name { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .fc-icon { font-size: 18px; }
  .fc-temps { font-size: 10px; display: flex; gap: 3px; }
  .fc-temps span { font-weight: 700; }
  .fc-low { color: var(--muted); }

  /* ===== GALLERY ===== */
  .slider-wrap { flex: 1; overflow: hidden; background: var(--bg-0); min-height: 260px; }
  .slides { display: flex; width: max-content; height: 100%; animation: slideRight 20s linear infinite; }
  .slides:hover, .slides:focus-within { animation-play-state: paused; }
  .slides img { width: 280px; height: 100%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
  @keyframes slideRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
  .lightbox { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 88vw; max-height: 84vh; object-fit: contain; border-radius: 8px; }
  .lb-close, .lb-prev, .lb-next { position: absolute; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 28px; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .lb-close { top: 20px; right: 20px; font-size: 24px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,0.25); }

  /* ===== FULL SCREEN WINDOWS (Apps) ===== */
  .app-window { position: fixed; inset: 0; z-index: 100; height: 100dvh; display: flex; flex-direction: column; background: var(--bg-0); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .app-window.open { opacity: 1; pointer-events: auto; }
  
  /* Modern Metallic UI for Headers */
  .app-head { 
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; 
    background: linear-gradient(180deg, var(--metal-1), var(--metal-2));
    border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
    box-shadow: var(--metal-shadow);
  }
  .app-title { font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  
  /* Metallic App Buttons */
  .app-btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; 
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 800; 
    background: linear-gradient(180deg, var(--metal-3), var(--metal-2));
    border: 1px solid var(--border); color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 5px rgba(0,0,0,0.3);
    transition: all 0.1s; cursor: pointer;
  }
  .app-btn:hover { border-color: var(--cyan); filter: brightness(1.2); }
  .app-btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
  .app-btn.primary { background: linear-gradient(180deg, var(--cyan-lite), var(--cyan-deep)); color: #fff; border-color: var(--cyan); text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .app-btn.danger { background: linear-gradient(180deg, #ef4444, #b91c1c); color: #fff; border-color: #dc2626; }

  .app-body { flex: 1; overflow-y: auto; padding: 30px 20px; max-width: 800px; margin: 0 auto; width: 100%; }

  /* ===== SCIENTIFIC CALCULATOR ===== */
  .sci-calc-container { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .sci-display { width: 100%; height: 80px; background: var(--bg-0); color: var(--cyan); border: 1px solid var(--border); border-radius: 12px; font-size: 36px; text-align: right; padding: 10px 16px; font-family: 'Share Tech Mono', monospace; font-weight: 700; outline: none; box-shadow: inset 0 4px 12px rgba(0,0,0,0.6); text-shadow: 0 0 10px var(--cyan-glow); }
  .sci-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sci-grid button { 
    border-radius: 10px; border: 1px solid var(--border); 
    background: linear-gradient(180deg, var(--metal-3), var(--metal-2)); color: var(--text); 
    font-size: 15px; font-weight: 700; padding: 14px 0; transition: all 0.1s; 
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
  }
  .sci-grid button:active { transform: scale(0.96); }
  .sci-grid .btn-num { background: var(--bg-2); }
  .sci-grid .btn-op { background: linear-gradient(180deg, var(--cyan), var(--cyan-deep)); color: #fff; border-color: var(--cyan); }
  .sci-grid .btn-equal { background: linear-gradient(180deg, var(--gold-lite), var(--gold-deep)); color: #1a1400; border-color: var(--gold); font-weight: 900; }
  .sci-grid .btn-action { background: linear-gradient(180deg, #475569, #1e293b); color: #fff; }
  .sci-grid .btn-func { background: rgba(0,163,204,0.1); color: var(--cyan); border-color: rgba(0,163,204,0.3); font-size: 13px; }

  /* ===== NOTES / TODO / METALLIC CARDS ===== */
  .metal-input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-0); color: var(--text); font-size: 15px; outline: none; box-shadow: inset 0 3px 8px rgba(0,0,0,0.4); }
  .metal-input:focus { border-color: var(--cyan); }
  
  .notes-list, .todo-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .metal-card { 
    padding: 16px; background: linear-gradient(180deg, var(--metal-1), var(--metal-2)); 
    border: 1px solid var(--border); border-radius: 12px; font-size: 15px; 
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    box-shadow: var(--metal-shadow);
  }
  .note-text { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .note-meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  
  .del-btn { background: transparent; border: none; color: var(--muted); padding: 4px; font-size: 20px; line-height: 1; border-radius: 6px; cursor: pointer; transition: color 0.2s; }
  .del-btn:hover { color: var(--danger); }
  
  .todo-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(180deg, var(--metal-1), var(--metal-2)); border: 1px solid var(--border); border-radius: 12px; font-size: 15px; box-shadow: var(--metal-shadow); }
  .todo-item input[type="checkbox"] { accent-color: var(--cyan); width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-text { flex: 1; word-break: break-word; }

  /* ===== POMODORO ===== */
  .pomo-body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 30px; padding-top: 40px; }
  .pomo-modes { display: flex; gap: 10px; background: var(--bg-0); padding: 6px; border-radius: 30px; border: 1px solid var(--border); box-shadow: inset 0 3px 8px rgba(0,0,0,0.5); }
  .pomo-modes button { padding: 10px 24px; border-radius: 24px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 800; transition: all 0.2s; }
  .pomo-modes button.active { background: linear-gradient(180deg, var(--cyan-lite), var(--cyan-deep)); color: #fff; box-shadow: 0 2px 10px var(--cyan-glow); }
  
  .pomo-time-container { background: linear-gradient(180deg, var(--metal-1), var(--metal-2)); padding: 30px 60px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--metal-shadow); }
  .pomo-time { font-size: 90px; font-weight: 900; font-family: 'Share Tech Mono', monospace; color: var(--text); line-height: 1; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
  .pomo-controls { display: flex; gap: 15px; }
  .pomo-controls button { padding: 16px 36px; border-radius: 12px; font-weight: 900; font-size: 16px; }

  /* ===== CONVERTER ===== */
  .conv-body { display: flex; flex-direction: column; gap: 20px; max-width: 450px; margin: 0 auto; width: 100%; padding-top: 20px; }
  .conv-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; background: var(--bg-1); padding: 12px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--metal-shadow); }
  .conv-row input { padding: 10px; border-radius: 8px; border: none; background: transparent; color: var(--text); font-size: 24px; outline: none; min-width: 0; font-weight: 800; font-family: 'Share Tech Mono', monospace; }
  .conv-row select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text); font-size: 14px; outline: none; font-weight: 700; }
  .conv-swap { display: flex; justify-content: center; margin: -10px 0; z-index: 2; }

<script>
'use strict';

const $ = (sel, ctx = document) => ctx.querySelector(sel);

/* ===== SAFE MATH EVALUATOR ===== */
function preprocess(expr) {
  return String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/√/g, 'sqrt')
    .replace(/π/g, '(3.141592653589793)').replace(/e/g, '(2.718281828459045)').replace(/(\d|\))%(?![0-9])/g, '$1/100');
}
function tokenize(expr) {
  const tokens = []; let i = 0;
  while (i < expr.length) {
    const c = expr[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i, dot = false;
      while (j < expr.length && /[0-9.]/.test(expr[j])) { if (expr[j] === '.') { if (dot) break; dot = true; } j++; }
      tokens.push({ type: 'num', value: parseFloat(expr.slice(i, j)) }); i = j; continue;
    }
    if (/[a-zA-Z]/.test(c)) {
      let j = i; while (j < expr.length && /[a-zA-Z]/.test(expr[j])) j++;
      tokens.push({ type: 'func', value: expr.slice(i, j).toLowerCase() }); i = j; continue;
    }
    if ('+-*/^%()'.includes(c)) { tokens.push({ type: 'op', value: c }); i++; continue; }
    throw new Error('Invalid');
  }
  return tokens;
}
function toRPN(tokens) {
  const out = [], ops = []; const prec = { '+':1, '-':1, '*':2, '/':2, '%':2, '^':3 }; const rightAssoc = { '^': true }; let prev = null;
  for (const t of tokens) {
    if (t.type === 'num') out.push(t);
    else if (t.type === 'func') ops.push(t);
    else if (t.value === '(') ops.push(t);
    else if (t.value === ')') {
      while (ops.length && ops[ops.length - 1].value !== '(') out.push(ops.pop());
      if (!ops.length) throw new Error('Mismatched');
      ops.pop(); if (ops.length && ops[ops.length - 1].type === 'func') out.push(ops.pop());
    } else {
      if (t.value === '-' && (prev === null || (prev.type === 'op' && prev.value !== ')') || prev.type === 'func')) out.push({ type: 'num', value: 0 });
      while (ops.length) {
        const top = ops[ops.length - 1];
        if (top.type === 'func' || top.value === '(') break;
        if (prec[top.value] > prec[t.value] || (prec[top.value] === prec[t.value] && !rightAssoc[t.value])) out.push(ops.pop());
        else break;
      }
      ops.push(t);
    }
    prev = t;
  }
  while (ops.length) { const op = ops.pop(); if (op.value === '(') throw new Error('Mismatched'); out.push(op); }
  return out;
}
function evalRPN(rpn) {
  const stack = [];
  for (const t of rpn) {
    if (t.type === 'num') { stack.push(t.value); continue; }
    if (t.type === 'func') {
      const a = stack.pop(); let r;
      switch (t.value) {
        case 'sin': r = Math.sin(a); break; case 'cos': r = Math.cos(a); break; case 'tan': r = Math.tan(a); break;
        case 'sqrt': r = Math.sqrt(a); break; case 'log': r = Math.log10(a); break; case 'ln': r = Math.log(a); break;
        default: throw new Error('Unknown');
      }
      stack.push(r); continue;
    }
    const b = stack.pop(), a = stack.pop();
    switch (t.value) {
      case '+': stack.push(a + b); break; case '-': stack.push(a - b); break; case '*': stack.push(a * b); break;
      case '/': if (b === 0) throw new Error('Div by 0'); stack.push(a / b); break;
      case '%': if (b === 0) throw new Error('Div by 0'); stack.push(a % b); break;
      case '^': stack.push(Math.pow(a, b)); break;
    }
  }
  return Math.round(stack[0] * 1e12) / 1e12;
}
function evaluate(expr) {
  if (!expr || !String(expr).trim()) throw new Error('Empty');
  return evalRPN(toRPN(tokenize(preprocess(expr))));
}

/* ===== MAIN CALCULATOR ===== */
let calcExpr = '0';
function updateCalcDisplay() { $('#calcDisplay').value = calcExpr || '0'; }
function appendCalc(ch) {
  if (ch === 'AC') { calcExpr = '0'; updateCalcDisplay(); return; }
  if (ch === 'DEL') { calcExpr = calcExpr.slice(0, -1) || '0'; updateCalcDisplay(); return; }
  if (calcExpr === '0' && /[0-9.]/.test(ch)) calcExpr = ch;
  else if (ch === '.') { if (!(calcExpr.match(/[0-9.]*$/) || [''])[0].includes('.')) calcExpr += ch; }
  else if ('+-×÷^%'.includes(ch)) { if ('+-×÷^%'.includes(calcExpr.slice(-1))) calcExpr = calcExpr.slice(0, -1) + ch; else calcExpr += ch; }
  else calcExpr += ch;
  updateCalcDisplay();
}
function calcEquals() {
  try { calcExpr = String(evaluate(calcExpr)); updateCalcDisplay(); } 
  catch (e) { $('#calcDisplay').value = 'Error'; setTimeout(() => { calcExpr = '0'; updateCalcDisplay(); }, 1200); }
}

/* ===== WEATHER ===== */
const WMO = { 0: { desc: 'Clear Sky', icon: '☀️', night: '🌙' }, 1: { desc: 'Mainly Clear', icon: '🌤️', night: '🌙' }, 2: { desc: 'Partly Cloudy', icon: '⛅', night: '☁️' }, 3: { desc: 'Overcast', icon: '☁️', night: '☁️' }, 45: { desc: 'Fog', icon: '🌫️', night: '🌫️' }, 51: { desc: 'Light Drizzle', icon: '🌦️', night: '🌦️' }, 61: { desc: 'Rain', icon: '🌧️', night: '🌧️' }, 71: { desc: 'Snow', icon: '🌨️', night: '🌨️' }, 95: { desc: 'Thunderstorm', icon: '⛈️', night: '⛈️' } };
function getWeatherIcon(code, isNight) { const c = WMO[code] || { icon: '❓', desc: 'Unknown' }; return isNight && c.night ? c.night : c.icon; }

async function fetchWeatherData(lat, lon, name) {
  $('#temp').textContent = '...'; $('#wIcon').textContent = '⏳'; $('#wDesc').textContent = 'Fetching...'; $('#wLoc').textContent = name;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max&hourly=relative_humidity_2m&timezone=auto&forecast_days=7`;
    const res = await fetch(url); const data = await res.json();
    
    const cur = data.current_weather; const daily = data.daily;
    const curTime = new Date(cur.time); const sunrise = new Date(daily.sunrise[0]); const sunset = new Date(daily.sunset[0]);
    const isNight = curTime < sunrise || curTime > sunset;
    
    $('#wIcon').textContent = getWeatherIcon(cur.weathercode, isNight);
    $('#temp').textContent = Math.round(cur.temperature) + '°C';
    $('#wDesc').textContent = (WMO[cur.weathercode]?.desc || 'Unknown') + (isNight ? ' (Night)' : '');
    
    let humidity = '--';
    if (data.hourly && data.hourly.time) {
      const idx = data.hourly.time.indexOf(cur.time);
      if (idx !== -1) humidity = data.hourly.relative_humidity_2m[idx];
    }
    
    $('#wRain').textContent = (daily.precipitation_probability_max[0] ?? '--') + '%';
    $('#wUv').textContent = daily.uv_index_max[0] ?? '--';
    $('#wHum').textContent = humidity + '%';
    $('#wWind').textContent = cur.windspeed + ' km/h';

    const fcEl = $('#wForecast'); fcEl.innerHTML = '';
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (let i = 0; i < 7; i++) {
      const d = new Date(daily.time[i] + 'T00:00');
      fcEl.innerHTML += `<div class="fc-day"><div class="fc-name">${i === 0 ? 'Today' : dayNames[d.getDay()]}</div><div class="fc-icon">${getWeatherIcon(daily.weathercode[i], false)}</div><div class="fc-temps"><span>${Math.round(daily.temperature_2m_max[i])}°</span><span class="fc-low">${Math.round(daily.temperature_2m_min[i])}°</span></div></div>`;
    }
    store('lastWeather', { lat, lon, name });
  } catch (e) {
    $('#temp').textContent = '--°'; $('#wIcon').textContent = '⚠️'; $('#wDesc').textContent = 'Error'; $('#wLoc').textContent = 'Try again';
  }
}

async function searchWeather() {
  const city = $('#cityInput').value.trim();
  if (!city) return;
  $('#temp').textContent = '...'; $('#wIcon').textContent = '🔍'; $('#wDesc').textContent = 'Searching...';
  
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=5&language=en&format=json`);
    const data = await res.json();
    
    if (!data.results || data.results.length === 0) {
      showToast('City not found. Try another name.', 'error');
      $('#wDesc').textContent = 'Not found';
      $('#wIcon').textContent = '⚠️';
      return;
    }

    if (data.results.length === 1) {
      const r = data.results[0];
      fetchWeatherData(r.latitude, r.longitude, `${r.name}, ${r.country_code}`);
    } else {
      // Multiple results, show custom choice modal
      showCityChooser(data.results);
    }
  } catch (e) {
    showToast('Network error', 'error');
  }
}

function showCityChooser(results) {
  const overlay = document.createElement('div'); overlay.className = 'custom-modal-overlay open';
  let listHtml = results.map((r, i) => `
    <button class="cm-btn" style="width:100%; justify-content:space-between; margin-bottom:8px; text-align:left;" onclick="pickCity(${r.latitude}, ${r.longitude}, '${r.name.replace(/'/g, "\\'")}, ${r.country_code || r.country}')">
      <span>${r.name}</span>
      <span style="color:var(--muted); font-size:12px;">${r.admin1 ? r.admin1 + ', ' : ''}${r.country}</span>
    </button>
  `).join('');
  
  overlay.innerHTML = `
    <div class="custom-modal">
      <div class="cm-head"><div class="cm-icon cyan">📍</div><div class="cm-title">Select Location</div></div>
      <div class="cm-body">Multiple cities found with that name. Please choose one:</div>
      <div style="padding: 0 20px 20px; max-height: 300px; overflow-y:auto;">${listHtml}</div>
      <div class="cm-footer"><button class="cm-btn cancel" onclick="this.closest('.custom-modal-overlay').remove()">Cancel</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function pickCity(lat, lon, name) {
  document.querySelector('.custom-modal-overlay').remove();
  fetchWeatherData(lat, lon, name);
}

function getLocationWeather() {
  if (navigator.geolocation) {
    $('#temp').textContent = '...'; $('#wIcon').textContent = '📍'; $('#wDesc').textContent = 'Locating...'; $('#wLoc').textContent = 'My Location';
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeatherData(pos.coords.latitude, pos.coords.longitude, 'My Location'),
      () => showToast('Location access denied', 'error')
    );
  } else {
    showToast('Geolocation not supported', 'error');
  }
}

const pomo = { minutes: 25, remaining: 25 * 60, running: false, interval: null };

  }
}

const UNITS = { length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, yd: 0.9144, ft: 0.3048, in: 0.0254 }, mass: { kg: 1, g: 0.001, mg: 0.000001, t: 1000, lb: 0.45359237, oz: 0.028349523 }, temp: { C: 1, F: 1, K: 1 }, area: { 'm²': 1, 'km²': 1e6, 'cm²': 1e-4, ha: 1e4, acre: 4046.8564224, 'ft²': 0.09290304, 'in²': 0.00064516 }, volume: { L: 1, mL: 0.001, 'm³': 1000, gal: 3.785411784, qt: 0.946352946, pt: 0.473176473, cup: 0.2365882365, floz: 0.0295735296 }, speed: { 'm/s': 1, 'km/h': 1/3.6, mph: 0.44704, knot: 0.514444 } };
function populateConvUnits() {
  const cat = $('#convCat').value; const units = Object.keys(UNITS[cat]); const from = $('#convFrom'), to = $('#convTo');
  from.innerHTML = ''; to.innerHTML = '';
  units.forEach((u, i) => {
    from.innerHTML += `<option value="${u}" ${i === 0 ? 'selected' : ''}>${u}</option>`;
    to.innerHTML += `<option value="${u}" ${i === 1 ? 'selected' : ''}>${u}</option>`;
  });
}
function convertTemp(v, f, t) { let c = f === 'C' ? v : f === 'F' ? (v - 32) * 5 / 9 : v - 273.15; return t === 'C' ? c : t === 'F' ? c * 9 / 5 + 32 : c + 273.15; }
function doConvert() {
  const cat = $('#convCat').value, input = parseFloat($('#convInput').value), from = $('#convFrom').value, to = $('#convTo').value;
  if (!isFinite(input)) { $('#convOutput').value = ''; return; }
  let result = cat === 'temp' ? convertTemp(input, from, to) : input * UNITS[cat][from] / UNITS[cat][to];
  $('#convOutput').value = String(Math.round(result * 1e8) / 1e8);
}
function swapConv() {
  const from = $('#convFrom'), to = $('#convTo'); const old = $('#convOutput').value;
  const tmp = from.value; from.value = to.value; to.value = tmp;
  if (old !== '') $('#convInput').value = old; doConvert();
}
populateConvUnits(); doConvert();

/* ===== CHATBOT SYSTEM ===== */
const BOT_API = '/chat';
const WELCOME_MSG = "Hi! I'm ZJ Bot 👋 How can I help you today?";
let chatSessions = load('chat_sessions', []);
let currentChatId = load('current_chat', null);

if (chatSessions.length > 0 && !chatSessions.find(s => s.id === currentChatId)) currentChatId = chatSessions[0].id;
else if (chatSessions.length === 0) currentChatId = null;

function persistChats() { store('chat_sessions', chatSessions); store('current_chat', currentChatId || ''); }
function getCurrentSession() { return chatSessions.find(s => s.id === currentChatId) || null; }
function createNewSession() {
  const id = 'chat_' + Date.now();
  const session = { id: id, title: 'New Chat', messages: [{ sender: 'bot', text: WELCOME_MSG }] };
  chatSessions.unshift(session); currentChatId = id; persistChats(); return session;
}

function formatMarkdown(text) {
  let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
       .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
  return s;
}

function renderChat() {
  const chatWindow = $('#chatWindow');
  chatWindow.innerHTML = '';
  const session = getCurrentSession(); if (!session) return;
  
  session.messages.forEach(m => {
    const wrapper = document.createElement('div'); wrapper.className = 'msg-wrapper ' + m.sender;
    const msgDiv = document.createElement('div'); msgDiv.className = 'msg ' + m.sender;
    if (m.sender === 'bot') msgDiv.innerHTML = formatMarkdown(m.text); else msgDiv.textContent = m.text;
    wrapper.appendChild(msgDiv);
    chatWindow.appendChild(wrapper);
  });
  
  if (session.messages.length === 1 && session.messages[0].text === WELCOME_MSG) {
    const suggWrap = document.createElement('div'); suggWrap.className = 'chat-suggestions';
    ['Hello!', 'Tell me a joke', "What's 12×8?", 'What can you do?'].forEach(text => {
      const chip = document.createElement('button'); chip.className = 'suggestion-chip'; chip.textContent = text; chip.style.cssText = 'background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-top:8px; margin-right:6px; cursor:pointer;';
      chip.onclick = () => { $('#chatInput').value = text; sendMessage(); };
      suggWrap.appendChild(chip);
    });
    chatWindow.appendChild(suggWrap);
  }
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function pushMessage(sender, text) {
  let session = getCurrentSession(); if (!session) session = createNewSession();
  session.messages.push({ sender: sender, text: text }); persistChats(); renderChat();
}

function openChat() {
  if (!currentChatId) createNewSession();
  $('#chatPanel').classList.add('open'); $('#chatFab').classList.add('hidden'); document.body.style.overflow = 'hidden';
  renderChat(); setTimeout(() => { $('#chatInput').focus(); }, 300);
}
function closeChat() {
  $('#chatPanel').classList.remove('open'); $('#chatFab').classList.remove('hidden'); document.body.style.overflow = '';
}

const JOKES = ["Why don't scientists trust atoms? Because they make up everything. 😄", "Why did the developer go broke? Because he used up all his cache. 💸", "Why do programmers prefer dark mode? Because light attracts bugs. 🐛"];
function localBotReply(text) {
  const t = text.toLowerCase().trim();
  if (/^(hi|hello|hey|yo)\b/.test(t)) return 'Hey there! 👋 What can I do for you?';
  if (/how are you/.test(t)) return "I'm running smoothly — thanks for asking! 😊";
  if (/your name|who are you/.test(t)) return "I'm **ZJ Bot**, built into ZJ Website.";
  if (/joke/.test(t)) return JOKES[Math.floor(Math.random() * JOKES.length)];
  if (/time/.test(t)) return "It's **" + new Date().toLocaleTimeString() + '** right now.';
  if (/date|today/.test(t)) return 'Today is **' + new Date().toLocaleDateString() + '**.';
  return "I'm a demo bot. Try: hello, joke, time, or math like 2+2.";
}
async function tryServer(text) {
  try {
    const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 2500);
    const res = await fetch(BOT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }), signal: controller.signal });
    clearTimeout(timer); if (!res.ok) throw new Error();
    const data = await res.json(); if (data && data.reply) return data.reply;
    throw new Error();
  } catch (e) { return null; }
}

async function sendMessage() {
  const chatInput = $('#chatInput');
  const text = chatInput.value.trim(); if (!text) return;
  if (!currentChatId) createNewSession();
  
  pushMessage('user', text); chatInput.value = '';
  $('#chatSendBtn').disabled = true; chatInput.disabled = true;
  
  const session = getCurrentSession();
  if (session && session.title === 'New Chat') { session.title = text.slice(0, 24); persistChats(); }
  
  const typingWrap = document.createElement('div'); typingWrap.className = 'msg-wrapper bot';
  typingWrap.innerHTML = '<div class="msg bot typing"><span class="dot-anim"></span><span class="dot-anim"></span><span class="dot-anim"></span></div>';
  $('#chatWindow').appendChild(typingWrap); $('#chatWindow').scrollTop = $('#chatWindow').scrollHeight;

  try {
    const reply = (await tryServer(text)) || localBotReply(text);
    typingWrap.remove(); pushMessage('bot', reply);
  } catch (e) {
    typingWrap.remove(); pushMessage('bot', '⚠️ Network error.');
  } finally {
    $('#chatSendBtn').disabled = false; chatInput.disabled = false; chatInput.focus();
  }
}

function newChat() { createNewSession(); renderChat(); showToast('New chat started'); }
function clearChat() {
  showCustomModal({
    title: 'Clear Chat', message: 'Delete all messages in this chat?', iconType: 'danger',
    iconHtml: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    confirmText: 'Clear', onConfirm: () => {
      const session = getCurrentSession();
      if (session) { session.messages = [{ sender: 'bot', text: WELCOME_MSG }]; session.title = 'New Chat'; persistChats(); renderChat(); }
      showToast('Chat cleared');
    }
  });
}

function showChatHistory() {
  const overlay = document.createElement('div'); overlay.className = 'custom-modal-overlay open';
  let listHtml = chatSessions.map(s => `
    <button class="cm-btn" style="width:100%; margin-bottom:8px; justify-content:space-between; border-color: ${s.id === currentChatId ? 'var(--cyan)' : 'var(--border)'}" onclick="loadChatSession('${s.id}')">
      <span style="font-weight:800; color:var(--text);">${s.title}</span>
      <span style="font-size:11px; color:var(--muted);">${s.messages.length} msgs</span>
    </button>
  `).join('');
  
  overlay.innerHTML = `
    <div class="custom-modal">
      <div class="cm-head"><div class="cm-icon cyan">💬</div><div class="cm-title">Chat History</div></div>
      <div style="padding: 0 20px 20px; max-height: 300px; overflow-y:auto;">${listHtml}</div>
      <div class="cm-footer"><button class="cm-btn cancel" onclick="this.closest('.custom-modal-overlay').remove()">Close</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function loadChatSession(id) {
  currentChatId = id; persistChats(); renderChat();
  document.querySelector('.custom-modal-overlay').remove();
}

function showCustomModal({ title, message, iconHtml, iconType, confirmText, onConfirm }) {
  const overlay = document.createElement('div'); overlay.className = 'custom-modal-overlay';
  overlay.innerHTML = `
    <div class="custom-modal">
      <div class="cm-head"><div class="cm-icon ${iconType}">${iconHtml}</div><div class="cm-title">${title}</div></div>
      <div class="cm-body">${message}</div>
      <div class="cm-footer">
        <button class="cm-btn cancel">Cancel</button>
        <button class="cm-btn confirm ${iconType === 'danger' ? 'danger' : ''}">${confirmText}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay); requestAnimationFrame(() => overlay.classList.add('open'));
  overlay.querySelector('.cancel').onclick = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 200); };
  overlay.querySelector('.confirm').onclick = () => { onConfirm(); overlay.querySelector('.cancel').click(); };
}
</script>
